<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>结算与对账 - 园区储值后台</title><link rel="stylesheet" href="shared-styles.css"><style>.tools{display:flex;gap:10px;margin-bottom:16px}.btn{width:auto;padding:0 18px}.admin-table{overflow:auto}.empty{text-align:center;color:var(--muted)}.issue{display:inline-block;padding:4px 8px;border-radius:999px;background:var(--error-bg);color:var(--error);font-size:12px}.ok{background:var(--success-bg);color:var(--success)}.hint{margin-bottom:16px;padding:12px 14px;border-radius:10px;background:var(--info-bg);color:var(--muted);font-size:13px}</style></head><body><div class="admin-layout"><aside class="admin-sidebar"><div class="brand">海智园区 · 储值后台</div><nav><a href="admin-accounts.html">账户管理</a><a href="admin-enterprises.html">企业管理</a><a href="admin-enterprise-recharge.html">代企业充值</a><a href="admin-recharge-batches.html">充值批次</a><a href="admin-orders.html">消费订单</a><a href="admin-refunds.html">退款审核</a><a class="active" href="admin-reconciliation.html">结算与对账</a><a href="admin-merchants.html">商户配置</a></nav></aside><main class="admin-content"><div class="admin-header"><h1>结算与对账</h1><div>管理员</div></div><section class="admin-metrics"><div class="admin-metric"><label>对账记录</label><b id="row-count">0</b></div><div class="admin-metric"><label>待结算</label><b id="settlement-count">0</b></div><div class="admin-metric"><label>差异记录</label><b id="issue-count">0</b></div><div class="admin-metric"><label>待结算金额</label><b id="settlement-total">¥0.00</b></div></section><div class="hint">系统联合充值、消费、退款与结算状态识别重复请求和退款结算冲突；原始业务状态保持不变。</div><div class="tools"><button class="btn btn-primary" id="sync" type="button">同步待结算订单</button><button class="btn btn-white" id="export" type="button">导出 CSV</button></div><div class="admin-table"><table id="reconciliation-table"><thead><tr><th>记录编号</th><th>业务</th><th>充值园区</th><th>消费园区</th><th>金额</th><th>平台状态</th><th>渠道状态</th><th>风险识别</th></tr></thead><tbody id="rows"></tbody></table></div></main></div><script src="shared-state.js"></script><script src="admin-utils.js"></script><script>(function(){'use strict';const state=parkState.state,tbody=document.getElementById('rows');function name(id){return(state.parks.find(function(x){return x.id===id})||{}).name||id||'-'}function td(row,text,className){const cell=document.createElement('td');cell.textContent=text;if(className)cell.className=className;row.appendChild(cell)}function park(){return window.parkV2Admin?window.parkV2Admin.getCurrentParkId():'park-001'}function duplicateIds(){const seen=new Set(),dupes=new Set();['transactions','rechargeBatches','orders','refundRequests'].forEach(function(key){(state[key]||[]).forEach(function(item){if(!item.requestId)return;if(seen.has(item.requestId))dupes.add(item.requestId);else seen.add(item.requestId)})});return dupes}function derivedRows(){const duplicates=duplicateIds(),items=(state.reconciliationRows||[]).filter(function(row){return row.rechargeParkId===park()||row.consumeParkId===park()}),reconciledOrders=new Set(items.filter(function(row){return row.type==='consume'}).map(function(row){return row.subject}));(state.orders||[]).filter(function(order){return order.consumeParkId===park()&&!reconciledOrders.has(order.id)}).forEach(function(order){let risk='一致';if(duplicates.has(order.requestId))risk='重复请求';if(order.refundStatus==='refunded'&&['settling','settled'].includes(order.settlementStatus))risk='退款结算冲突';items.push({id:'ORDER-'+order.id,type:'consume',subject:order.id,rechargeParkId:(order.rechargeParkIds||[]).join('、'),consumeParkId:order.consumeParkId,amount:order.amount,platformStatus:order.paymentStatus,channelStatus:order.settlementStatus,diff:risk==='一致'?'consistent':risk})});return items}function parkLabel(value){if(!value)return '-';return String(value).split('、').map(name).join('、')}function risk(row){if(row.diff==='duplicate'||row.diff==='重复请求')return'重复请求';if(row.diff==='refund_settlement_conflict'||row.diff==='退款结算冲突')return'退款结算冲突';return row.diff==='consistent'?'一致':String(row.diff||'待核对')}function render(){const rows=derivedRows(),settlements=(state.pendingSettlements||[]).filter(function(x){return x.consumeParkId===park()}),issues=rows.filter(function(x){return risk(x)!=='一致'});document.getElementById('row-count').textContent=rows.length;document.getElementById('settlement-count').textContent=settlements.length;document.getElementById('issue-count').textContent=issues.length;document.getElementById('settlement-total').textContent='¥'+formatMoney(settlements.reduce(function(s,x){return s+(Number(x.settlementAmount)||0)},0));tbody.replaceChildren();if(!rows.length){const tr=document.createElement('tr'),cell=document.createElement('td');cell.colSpan=8;cell.className='empty';cell.textContent='当前园区暂无对账记录';tr.appendChild(cell);tbody.appendChild(tr);return}rows.forEach(function(item){const tr=document.createElement('tr'),r=risk(item);td(tr,item.id);td(tr,item.subject||item.type);td(tr,parkLabel(item.rechargeParkId));td(tr,parkLabel(item.consumeParkId));td(tr,'¥'+formatMoney(item.amount));td(tr,item.platformStatus||'-');td(tr,item.channelStatus||'-');td(tr,r,r==='一致'?'issue ok':'issue');tbody.appendChild(tr)})}document.getElementById('sync').addEventListener('click',function(){const result=parkState.actions.syncSettlements();if(!result.ok){alert('同步失败：'+result.code);return}render()});document.getElementById('export').addEventListener('click',function(){window.exportTableCsv('reconciliation-table','结算与对账')});window.addEventListener('parkchange',render);render()})();</script></body></html>
