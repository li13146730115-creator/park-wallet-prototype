<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>园区储值一期 MVP 原型</title>
  <link rel="stylesheet" href="shared-styles.css">
  <style>
    .landing-layout { display: flex; min-height: 100vh; background: var(--page-bg); }

    .landing-sidebar {
      flex: 0 0 232px;
      background: var(--card-bg);
      border-right: 1px solid var(--border);
      padding: 20px 14px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
    }

    .landing-brand { font-size: 15px; font-weight: 700; color: var(--ink); padding: 0 6px; }
    .landing-brand small { display: block; margin-top: 4px; font-size: 11px; font-weight: 400; color: var(--muted); }

    .nav-group h2 {
      display: flex;
      align-items: center;
      gap: 7px;
      margin: 0 6px 8px;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
    }

    .nav-group h2 .icon {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      display: grid;
      place-items: center;
      font-size: 11px;
    }

    .nav-group.user h2 .icon { background: #eaf9ef; }
    .nav-group.merchant h2 .icon { background: #fff6e5; }
    .nav-group.admin h2 .icon { background: #e9f5ff; }

    .nav-group nav { display: grid; gap: 4px; }

    .nav-group nav a {
      display: block;
      padding: 9px 12px;
      border-radius: var(--radius-small);
      color: var(--ink);
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .nav-group nav a:hover { background: var(--info-bg); color: var(--info); }
    .nav-group nav a:active { transform: scale(0.98); }

    .landing-main { flex: 1; min-width: 0; padding: 0 var(--page-padding) 80px; }

    .landing-hero {
      background: var(--gradient-hero);
      margin: 0 calc(-1 * var(--page-padding)) 18px;
      padding: 34px 24px 38px;
      color: #fff;
      text-align: center;
    }

    .landing-hero h1 { margin: 0 0 6px; font-size: 22px; font-weight: 700; }
    .landing-hero p { margin: 0; font-size: 13px; opacity: 0.88; }

    .entry-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }

    .entry-card {
      background: var(--card-bg);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-card);
      padding: 18px 16px;
      text-decoration: none;
      color: var(--ink);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .entry-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-float); }
    .entry-card b { display: block; font-size: 15px; margin-bottom: 6px; }
    .entry-card span { font-size: 12px; color: var(--muted); line-height: 1.5; }

    .actions {
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }

    .reset-btn {
      width: 100%;
      max-width: 320px;
      height: 46px;
      border: 0;
      border-radius: var(--radius-button);
      background: var(--error);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 9px 20px rgba(255, 77, 79, 0.22);
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .reset-btn:hover { opacity: 0.92; }
    .reset-btn:active { transform: scale(0.98); }

    .note {
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
      max-width: 320px;
    }

    .test-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 18px;
      background: var(--card-bg);
      border-radius: var(--radius-pill);
      color: var(--info);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      box-shadow: var(--shadow-card);
    }

    @media (max-width: 767px) {
      .landing-layout { flex-direction: column; }
      .landing-sidebar {
        flex: none;
        width: 100%;
        height: auto;
        position: static;
        border-right: 0;
        border-bottom: 1px solid var(--border);
      }
      .entry-cards { grid-template-columns: 1fr; }
      .landing-hero { border-radius: 0 0 var(--radius-card) var(--radius-card); }
    }
  </style>
</head>
<body>
  <div class="landing-layout">
    <aside class="landing-sidebar">
      <div class="landing-brand">园区储值原型<small>快捷操作入口</small></div>

      <section class="nav-group user">
        <h2><span class="icon">U</span>用户移动端</h2>
        <nav>
          <a href="user-home.html">园区码服务</a>
          <a href="user-wallet.html">钱包首页</a>
          <a href="user-recharge.html">余额充值</a>
          <a href="user-payment-code.html">付款码</a>
          <a href="user-refund.html">注销申请</a>
        </nav>
      </section>

      <section class="nav-group merchant">
        <h2><span class="icon">M</span>商户移动端</h2>
        <nav>
          <a href="merchant-home.html">商户首页</a>
          <a href="merchant-scan.html">扫码收款</a>
          <a href="merchant-orders.html">订单记录</a>
          <a href="merchant-settlements.html">分账管理</a>
        </nav>
      </section>

      <section class="nav-group admin">
        <h2><span class="icon">A</span>园区运营后台</h2>
        <nav>
          <a href="admin-accounts.html">账户管理</a>
          <a href="admin-orders.html">订单管理</a>
          <a href="admin-refunds.html">退款审核</a>
          <a href="admin-settlements.html">分账管理</a>
          <a href="admin-merchants.html">商户配置</a>
        </nav>
      </section>
    </aside>

    <main class="landing-main">
      <div class="landing-hero">
        <h1>园区储值一期 MVP 原型</h1>
        <p>单一余额 · 用户移动端 · 商户移动端 · 园区运营后台</p>
      </div>

      <div class="entry-cards">
        <a class="entry-card" href="user-home.html"><b>用户移动端</b><span>园区码、钱包、充值、付款码、注销申请</span></a>
        <a class="entry-card" href="merchant-home.html"><b>商户移动端</b><span>扫码收款、订单记录、分账管理</span></a>
        <a class="entry-card" href="admin-accounts.html"><b>园区运营后台</b><span>账户、订单、退款审核、分账、商户配置</span></a>
      </div>

      <div class="actions">
        <a class="test-link" href="test-runner.html">运行原型测试</a>
        <button class="reset-btn" type="button" onclick="resetState()">重置模拟状态</button>
        <p class="note">本原型使用浏览器本地存储模拟状态，重置后恢复初始数据。</p>
      </div>
    </main>
  </div>

  <script src="shared-state.js"></script>
  <script>
    function resetState() {
      localStorage.removeItem('parkStateV2');
      window.location.reload();
    }
  </script>
</body>
</html>
