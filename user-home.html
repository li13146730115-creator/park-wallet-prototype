<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>园区码服务</title>
  <link rel="stylesheet" href="shared-styles.css">
  <style>
    .code-service-item.access-service { padding: 0; }
    .code-service-access-hero {
      width: 100%;
      padding: 18px 16px 16px;
      text-align: center;
    }
    .access-hero-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 12px;
    }
    .dynamic-qr-hero {
      width: 160px;
      height: 160px;
      margin: 0 auto;
    }
    .access-hero-refresh {
      margin-top: 10px;
      font-size: 11px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="mobile-page">
    <div class="phone-shell">
      <div class="status-bar">
        <span>9:41</span>
        <span class="status-icons"><span class="signal"><i></i><i></i><i></i><i></i></span><span>5G</span><span class="battery"><b></b></span></span>
      </div>
      <div class="app-shell">
        <header class="topbar">
          <button class="topbar-icon back" type="button" aria-label="返回" onclick="history.back()">‹</button>
          <strong>园区码服务</strong>
          <span class="more">•••</span>
        </header>
        <main class="app-content code-service-page">
          <section class="code-service-list" aria-label="园区码服务列表">
            <button class="code-service-item access-service" type="button" data-code="access">
              <div class="code-service-access-hero">
                <div class="access-hero-title">园区通行码</div>
                <div id="access-qr" class="dynamic-qr dynamic-qr-hero" role="img" aria-label="园区通行码二维码"></div>
                <div class="access-hero-refresh">60 秒后自动刷新</div>
              </div>
            </button>

            <button class="code-service-item cafeteria-service" type="button" data-code="cafeteria" aria-haspopup="dialog" aria-controls="code-modal">
              <span class="service-logo" aria-hidden="true">
                <svg viewBox="0 0 48 48" fill="none"><path d="M10 27h28c0 7.2-5.8 13-13 13h-2c-7.2 0-13-5.8-13-13Z"/><path d="M15 23a9 9 0 0 1 18 0M24 14v-4"/><path d="M8 27h32"/></svg>
              </span>
              <span class="service-copy"><strong>食堂付款码</strong><span>仅用于园区食堂消费</span><em>点击出示付款码</em></span>
              <span class="service-arrow" aria-hidden="true">›</span>
            </button>

            <button class="code-service-item wallet-service" type="button" data-code="stored-value" aria-haspopup="dialog" aria-controls="code-modal">
              <span class="service-logo" aria-hidden="true">
                <svg viewBox="0 0 48 48" fill="none"><rect x="7" y="12" width="34" height="27" rx="7"/><path d="M7 19h28a6 6 0 0 1 6 6v6H30a5 5 0 0 1 0-10h11"/><circle cx="31" cy="26" r="1.7"/></svg>
              </span>
              <span class="service-copy"><strong>储值付款码</strong><span>用于园区签约商户消费</span><em>余额支付 · 安全可用</em></span>
              <span class="service-arrow" aria-hidden="true">›</span>
            </button>
          </section>

          <p class="code-service-note">动态码会自动刷新，请勿向他人转发。</p>
        </main>
        <nav class="bottom-nav">
          <div class="nav-item active"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>首页</div>
          <div class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><rect x="2" y="3" width="20" height="14" rx="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>服务</div>
          <div class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M12 2l9 4.9V17L12 22l-9-4.9V7z"></path></svg>领福利</div>
          <div class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>客服</div>
          <a class="nav-item" href="user-wallet.html"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>我的</a>
        </nav>
        <div class="home-bar"></div>
      </div>
    </div>
  </div>

  <div id="code-modal" class="code-modal" role="dialog" aria-modal="true" aria-labelledby="code-modal-title" hidden>
    <div class="code-modal-panel">
      <button id="code-modal-close" class="code-modal-close" type="button" aria-label="关闭付款码">×</button>
      <h2 id="code-modal-title"></h2>
      <div id="modal-qr" class="dynamic-qr dynamic-qr-modal" role="img"></div>
      <div class="code-refresh-state code-modal-refresh"><span class="refresh-dot"></span><span id="modal-refresh">60 秒后自动刷新</span></div>
    </div>
  </div>

  <script>
    (function () {
      'use strict';
      const codeTitles = { access: '园区通行码', cafeteria: '食堂付款码', 'stored-value': '储值付款码' };
      const codeDescriptions = { access: '用于园区门禁核验', cafeteria: '请向食堂收银员出示', 'stored-value': '请向园区签约商户出示' };
      const appPage = document.querySelector('.mobile-page');
      const modal = document.getElementById('code-modal');
      const modalTitle = document.getElementById('code-modal-title');
      const modalQR = document.getElementById('modal-qr');
      const modalClose = document.getElementById('code-modal-close');
      const accessQR = document.getElementById('access-qr');
      let activeTrigger = null;
      let secondsRemaining = 60;
      let refreshTimer = null;

      function renderQR(element) {
        element.innerHTML = '';
        for (let i = 0; i < 25 * 25; i++) {
          const cell = document.createElement('span');
          cell.className = Math.random() < 0.5 ? 'filled' : '';
          element.appendChild(cell);
        }
      }

      function updateRefreshLabels() {
        document.getElementById('modal-refresh').textContent = secondsRemaining + ' 秒后自动刷新';
      }

      function refreshCodes() {
        if (!modal.hidden) renderQR(modalQR);
        renderQR(accessQR);
        secondsRemaining = 60;
        updateRefreshLabels();
      }

      function startRefreshTimer() {
        if (refreshTimer) clearInterval(refreshTimer);
        refreshTimer = setInterval(() => {
          secondsRemaining -= 1;
          if (secondsRemaining <= 0) refreshCodes();
          else updateRefreshLabels();
        }, 1000);
      }

      function getModalFocusables() {
        return Array.from(modal.querySelectorAll('button:not([disabled]), [href], input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])'));
      }

      function openCodeModal(trigger) {
        activeTrigger = trigger;
        const title = codeTitles[trigger.dataset.code];
        modalTitle.textContent = title;
        modalTitle.dataset.description = codeDescriptions[trigger.dataset.code];
        modalQR.setAttribute('aria-label', title + '二维码');
        renderQR(modalQR);
        modal.hidden = false;
        appPage.setAttribute('inert', '');
        updateRefreshLabels();
        modalClose.focus();
      }

      function closeCodeModal() {
        if (modal.hidden) return;
        modal.hidden = true;
        appPage.removeAttribute('inert');
        if (activeTrigger) activeTrigger.focus();
        activeTrigger = null;
      }

      function handleModalKeydown(event) {
        if (modal.hidden) return;
        if (event.key === 'Escape') {
          closeCodeModal();
          return;
        }
        if (event.key !== 'Tab') return;
        const focusables = getModalFocusables();
        if (!focusables.length) {
          event.preventDefault();
          return;
        }
        const first = focusables[0];
        const last = focusables[focusables.length - 1];
        if (event.shiftKey && (document.activeElement === first || !modal.contains(document.activeElement))) {
          event.preventDefault();
          last.focus();
        } else if (!event.shiftKey && (document.activeElement === last || !modal.contains(document.activeElement))) {
          event.preventDefault();
          first.focus();
        }
      }

      document.querySelectorAll('.code-service-item').forEach(trigger => {
        trigger.addEventListener('click', () => {
          if (trigger.dataset.code === 'access') {
            refreshCodes();
          } else {
            openCodeModal(trigger);
          }
        });
      });
      modalClose.addEventListener('click', closeCodeModal);
      modal.addEventListener('click', event => { if (event.target === modal) closeCodeModal(); });
      document.addEventListener('keydown', handleModalKeydown);
      window.addEventListener('pagehide', () => { if (refreshTimer) clearInterval(refreshTimer); });
      refreshCodes();
      startRefreshTimer();
    })();
  </script>
  <script src="shared-nav.js"></script>
</body>
</html>
