<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>企业管理 - 园区储值后台</title><link rel="stylesheet" href="shared-styles.css">
  <style>.toolbar{display:flex;gap:10px;margin-bottom:16px}.toolbar input{min-width:280px;padding:10px 12px;border:1px solid var(--border);border-radius:8px}.status{padding:4px 8px;border-radius:999px;background:var(--success-bg);color:var(--success);font-size:12px}.empty{text-align:center;color:var(--muted)}.amount{font-weight:700}.admin-table{overflow:auto}</style>
</head>
<body><div class="admin-layout"><aside class="admin-sidebar"><div class="brand">海智园区 · 储值后台</div><nav><a href="admin-accounts.html">账户管理</a><a class="active" href="admin-enterprises.html">企业管理</a><a href="admin-enterprise-recharge.html">代企业充值</a><a href="admin-recharge-batches.html">充值批次</a><a href="admin-orders.html">消费订单</a><a href="admin-refunds.html">退款审核</a><a href="admin-reconciliation.html">结算与对账</a><a href="admin-merchants.html">商户配置</a></nav></aside><main class="admin-content"><div class="admin-header"><h1>企业管理</h1><div>管理员</div></div><section class="admin-metrics"><div class="admin-metric"><label>企业数量</label><b id="enterprise-count">0</b></div><div class="admin-metric"><label>关联员工</label><b id="employee-count">0</b></div><div class="admin-metric"><label>累计充值</label><b id="recharge-total">¥0.00</b></div><div class="admin-metric"><label>退款申请</label><b id="refund-count">0</b></div></section><div class="toolbar"><input id="keyword" type="search" placeholder="搜索企业名称 / 企业编号 / 企业管理员"></div><div class="admin-table"><table><thead><tr><th>企业</th><th>所属园区</th><th>企业管理员</th><th>关联员工</th><th>充值</th><th>退款</th><th>状态</th></tr></thead><tbody id="enterprise-table"></tbody></table></div></main></div>
<script src="shared-state.js"></script><script src="admin-utils.js"></script><script>(function(){'use strict';const state=parkState.state,tbody=document.getElementById('enterprise-table'),keyword=document.getElementById('keyword');function money(v){return '¥'+formatMoney(Number(v)||0)}function name(items,id){return(items.find(function(x){return x.id===id})||{}).name||id||'-'}function td(row,text,className){const cell=document.createElement('td');cell.textContent=text;if(className)cell.className=className;row.appendChild(cell)}function parkId(){return window.parkV2Admin?window.parkV2Admin.getCurrentParkId():'park-001'}function admins(ent){return(ent.adminUserIds||[]).map(function(id){return name(state.users,id)}).join('、')||'-'}function employees(ent){return(ent.employeeUserIds||[]).map(function(id){return name(state.users,id)}).join('、')||'-'}function batches(ent){return(state.rechargeBatches||[]).filter(function(x){return x.enterpriseId===ent.id&&x.postingStatus==='succeeded'})}function refunds(ent){return(state.refundRequests||[]).filter(function(x){return x.enterpriseId===ent.id})}function current(){const key=keyword.value.trim().toLowerCase();return(state.enterprises||[]).filter(function(ent){const admin=admins(ent);return ent.parkId===parkId()&&(!key||[ent.id,ent.name,admin].join(' ').toLowerCase().includes(key))})}function render(){const data=current(),allBatches=data.reduce(function(rows,ent){return rows.concat(batches(ent))},[]),allRefunds=data.reduce(function(rows,ent){return rows.concat(refunds(ent))},[]);document.getElementById('enterprise-count').textContent=data.length;document.getElementById('employee-count').textContent=data.reduce(function(sum,ent){return sum+(ent.employeeUserIds||[]).length},0);document.getElementById('recharge-total').textContent=money(allBatches.reduce(function(sum,b){return sum+(Number(b.totalAmount)||0)},0));document.getElementById('refund-count').textContent=allRefunds.length;tbody.replaceChildren();if(!data.length){const tr=document.createElement('tr');const cell=document.createElement('td');cell.colSpan=7;cell.className='empty';cell.textContent='当前园区暂无企业';tr.appendChild(cell);tbody.appendChild(tr);return}data.forEach(function(ent){const tr=document.createElement('tr'),bs=batches(ent),rs=refunds(ent);td(tr,ent.name+'（'+ent.id+'）');td(tr,name(state.parks,ent.parkId));td(tr,admins(ent));td(tr,employees(ent));td(tr,money(bs.reduce(function(sum,b){return sum+(Number(b.totalAmount)||0)},0))+' / '+bs.length+' 批','amount');td(tr,money(rs.reduce(function(sum,r){return sum+(Number(r.amount)||0)},0))+' / '+rs.length+' 笔');td(tr,ent.status==='active'?'正常':'停用','status');tbody.appendChild(tr)})}keyword.addEventListener('input',render);window.addEventListener('parkchange',render);render()})();</script></body></html>
