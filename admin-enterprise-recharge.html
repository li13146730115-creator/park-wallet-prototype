<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>代企业充值 - 园区储值后台</title><link rel="stylesheet" href="shared-styles.css"><style>.form-card,.result-card{padding:20px;background:#fff;border-radius:16px;box-shadow:var(--shadow-card);margin-bottom:16px}.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.field{display:grid;gap:7px}.field label{color:var(--muted);font-size:12px}.field select,.field input{padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:#fff;font:inherit}.actions{display:flex;gap:10px;margin-top:18px}.btn{width:auto;padding:0 20px}.result-card[hidden]{display:none}.result-head{display:flex;justify-content:space-between;align-items:center}.result-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}.result-grid div{padding:12px;background:var(--page-bg);border-radius:10px}.result-grid span,.error-list span{display:block;color:var(--muted);font-size:12px}.result-grid b{display:block;margin-top:5px}.confirm{display:flex;gap:10px;margin-top:16px}.confirm input{flex:1;padding:10px 12px;border:1px solid var(--border);border-radius:8px}.error-list{margin-top:16px;padding:14px;border-radius:10px;background:var(--error-bg)}.error-list ul{margin:8px 0 0;padding-left:20px}.message{margin-top:12px;color:var(--muted)}@media(max-width:900px){.form-grid,.result-grid{grid-template-columns:1fr 1fr}}</style></head>
<body><div class="admin-layout"><aside class="admin-sidebar"><div class="brand">海智园区 · 储值后台</div><nav><a href="admin-accounts.html">账户管理</a><a href="admin-enterprises.html">企业管理</a><a class="active" href="admin-enterprise-recharge.html">代企业充值</a><a href="admin-recharge-batches.html">充值批次</a><a href="admin-orders.html">消费订单</a><a href="admin-refunds.html">退款审核</a><a href="admin-reconciliation.html">结算与对账</a><a href="admin-merchants.html">商户配置</a></nav></aside><main class="admin-content"><div class="admin-header"><h1>园区代企业充值</h1><div>管理员</div></div><section class="form-card"><h2>创建充值批次</h2><div class="form-grid"><div class="field"><label for="enterprise">企业</label><select id="enterprise"></select></div><div class="field"><label for="employee">关联员工</label><select id="employee"></select></div><div class="field"><label for="amount">充值金额</label><input id="amount" type="number" min="0.01" step="0.01" placeholder="0.00"></div></div><div class="actions"><button class="btn btn-primary" id="create" type="button">校验并创建</button><a class="btn btn-white" href="admin-recharge-batches.html">查看充值批次</a></div><p class="message" id="message"></p></section><section class="result-card" id="result" hidden><div class="result-head"><h2>批次处理</h2><span id="batch-status" class="tag tag-info"></span></div><div class="result-grid"><div><span>批次编号</span><b id="batch-id">-</b></div><div><span>充值金额</span><b id="batch-amount">-</b></div><div><span>校验状态</span><b id="validation-status">-</b></div><div><span>到账状态</span><b id="posting-status">-</b></div></div><div class="error-list" id="errors" hidden><strong>错误明细</strong><ul id="error-items"></ul></div><div class="confirm" id="confirm-area"><input id="voucher" maxlength="200" placeholder="请输入支付凭证编号"><button class="btn btn-primary" id="confirm" type="button">到账确认</button></div><p class="message" id="confirm-message"></p></section></main></div>
<script src="shared-state.js"></script><script src="admin-utils.js"></script><script>(function(){'use strict';const state=parkState.state,enterprise=document.getElementById('enterprise'),employee=document.getElementById('employee'),amount=document.getElementById('amount'),resultCard=document.getElementById('result'),errors=document.getElementById('errors'),errorItems=document.getElementById('error-items');let currentBatch=null;function text(id,value){document.getElementById(id).textContent=value}function option(value,label){const node=document.createElement('option');node.value=value;node.textContent=label;return node}function currentPark(){return window.parkV2Admin?window.parkV2Admin.getCurrentParkId():'park-001'}function enterprises(){return(state.enterprises||[]).filter(function(item){return item.parkId===currentPark()&&item.status==='active'})}function renderEnterprises(){const selected=enterprise.value;enterprise.replaceChildren();const data=enterprises();if(!data.length){enterprise.appendChild(option('','当前园区暂无企业'));employee.replaceChildren(option('','暂无员工'));return}data.forEach(function(item){enterprise.appendChild(option(item.id,item.name))});if(data.some(function(item){return item.id===selected}))enterprise.value=selected;renderEmployees()}function renderEmployees(){const found=state.enterprises.find(function(item){return item.id===enterprise.value}),ids=found&&found.employeeUserIds||[];employee.replaceChildren();if(!ids.length){employee.appendChild(option('','暂无关联员工'));return}ids.forEach(function(id){const user=state.users.find(function(item){return item.id===id});employee.appendChild(option(id,user?user.name+'（'+user.phone+'）':id))})}function showBatch(batch){currentBatch=batch;resultCard.hidden=false;text('batch-id',batch.id);text('batch-amount','¥'+formatMoney(batch.totalAmount));text('validation-status',batch.validationStatus==='passed'?'通过':'失败');text('posting-status',batch.postingStatus==='succeeded'?'已到账':'待到账');text('batch-status',batch.status);const items=(state.rechargeBatchItems||[]).filter(function(item){return item.batchId===batch.id}),failed=items.filter(function(item){return !(item.validationResult.length===1&&item.validationResult[0]==='valid')});errorItems.replaceChildren();errors.hidden=!failed.length;failed.forEach(function(item){const li=document.createElement('li');li.textContent=(item.userId||'未知员工')+'：'+item.validationResult.join('、');errorItems.appendChild(li)});document.getElementById('confirm-area').hidden=batch.validationStatus!=='passed'||batch.postingStatus==='succeeded'}document.getElementById('create').addEventListener('click',function(){text('message','');const value=Number(amount.value);if(!enterprise.value||!employee.value||!Number.isFinite(value)||value<=0){text('message','请选择企业和员工，并输入有效充值金额。');return}const requestId='ADMIN-OFFLINE-'+Date.now();const created=parkState.actions.createEnterpriseRecharge({enterpriseId:enterprise.value,rechargeParkId:currentPark(),method:'offline',requestId:requestId,items:[{userId:employee.value,amount:value}]});if(created.data)showBatch(created.data);text('message',created.ok?'批次已创建，请补充支付凭证并执行到账确认。':'创建失败：'+created.code)});document.getElementById('confirm').addEventListener('click',function(){if(!currentBatch)return;const confirmed=parkState.actions.confirmOfflineRecharge(currentBatch.id,document.getElementById('voucher').value.trim());text('confirm-message',confirmed.ok?'到账确认成功，企业余额已入账。':'到账确认失败：'+confirmed.code);if(confirmed.data)showBatch(confirmed.data)});enterprise.addEventListener('change',renderEmployees);window.addEventListener('parkchange',renderEnterprises);renderEnterprises()})();</script></body></html>
