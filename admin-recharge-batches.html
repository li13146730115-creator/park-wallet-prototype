<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>充值批次 - 园区储值后台</title><link rel="stylesheet" href="shared-styles.css"><style>.tabs{display:flex;gap:8px;margin-bottom:16px}.tabs button{padding:9px 15px;border:1px solid var(--border);border-radius:999px;background:#fff;color:var(--muted)}.tabs button.active{background:var(--info-bg);border-color:var(--info);color:var(--info);font-weight:700}.admin-table{overflow:auto}.empty{text-align:center;color:var(--muted)}.status{display:inline-block;padding:4px 8px;border-radius:999px;background:var(--info-bg);color:var(--info);font-size:12px}.amount{font-weight:700}</style></head><body><div class="admin-layout"><aside class="admin-sidebar"><div class="brand">海智园区 · 储值后台</div><nav><a href="admin-accounts.html">账户管理</a><a href="admin-enterprises.html">企业管理</a><a href="admin-enterprise-recharge.html">代企业充值</a><a class="active" href="admin-recharge-batches.html">充值批次</a><a href="admin-orders.html">消费订单</a><a href="admin-refunds.html">退款审核</a><a href="admin-reconciliation.html">结算与对账</a><a href="admin-merchants.html">商户配置</a></nav></aside><main class="admin-content"><div class="admin-header"><h1>充值批次</h1><div>管理员</div></div><section class="admin-metrics"><div class="admin-metric"><label>记录数量</label><b id="count">0</b></div><div class="admin-metric"><label>充值金额</label><b id="total">¥0.00</b></div><div class="admin-metric"><label>待处理</label><b id="pending">0</b></div></section><div class="tabs" id="tabs"><button class="active" data-kind="all">全部</button><button data-kind="personal">个人在线充值</button><button data-kind="online">企业在线充值</button><button data-kind="offline">园区代企业充值</button></div><div class="admin-table"><table><thead><tr><th>类型</th><th>编号</th><th>充值对象</th><th>充值园区</th><th>金额</th><th>校验</th><th>支付</th><th>入账</th><th>时间</th></tr></thead><tbody id="rows"></tbody></table></div></main></div><script src="shared-state.js"></script><script src="admin-utils.js"></script><script>(function(){'use strict';const state=parkState.state,tbody=document.getElementById('rows');let kind='all';function name(items,id){return(items.find(function(x){return x.id===id})||{}).name||id||'-'}function td(row,text,className){const cell=document.createElement('td');cell.textContent=text;if(className)cell.className=className;row.appendChild(cell)}function park(){return window.parkV2Admin?window.parkV2Admin.getCurrentParkId():'park-001'}function data(){const personal=(state.transactions||[]).filter(function(x){return x.type==='personal_recharge'&&x.parkId===park()}).map(function(x){return{kind:'personal',type:'个人在线充值',id:x.id,target:name(state.users,x.userId),parkId:x.parkId,amount:x.amount,validation:'通过',payment:'已支付',posting:'已入账',createdAt:x.createdAt}}),batches=(state.rechargeBatches||[]).filter(function(x){return x.rechargeParkId===park()}).map(function(x){return{kind:x.method,type:x.method==='online'?'企业在线充值':'园区代企业充值',id:x.id,target:name(state.enterprises,x.enterpriseId),parkId:x.rechargeParkId,amount:x.totalAmount,validation:x.validationStatus==='passed'?'通过':'失败',payment:x.paymentStatus==='succeeded'?'已支付':'待支付',posting:x.postingStatus==='succeeded'?'已入账':'待入账',createdAt:x.createdAt}});return personal.concat(batches).filter(function(x){return kind==='all'||x.kind===kind}).sort(function(a,b){return String(b.createdAt).localeCompare(String(a.createdAt))})}function render(){const items=data();document.getElementById('count').textContent=items.length;document.getElementById('total').textContent='¥'+formatMoney(items.reduce(function(s,x){return s+(Number(x.amount)||0)},0));document.getElementById('pending').textContent=items.filter(function(x){return x.posting!=='已入账'}).length;tbody.replaceChildren();if(!items.length){const tr=document.createElement('tr'),cell=document.createElement('td');cell.colSpan=9;cell.className='empty';cell.textContent='当前园区暂无充值记录';tr.appendChild(cell);tbody.appendChild(tr);return}items.forEach(function(item){const tr=document.createElement('tr');td(tr,item.type);td(tr,item.id);td(tr,item.target);td(tr,name(state.parks,item.parkId));td(tr,'¥'+formatMoney(item.amount),'amount');td(tr,item.validation,'status');td(tr,item.payment);td(tr,item.posting);td(tr,item.createdAt||'-');tbody.appendChild(tr)})}document.getElementById('tabs').addEventListener('click',function(e){if(e.target.tagName!=='BUTTON')return;kind=e.target.dataset.kind;Array.from(this.children).forEach(function(b){b.classList.toggle('active',b===e.target)});render()});window.addEventListener('parkchange',render);render()})();</script></body></html>
