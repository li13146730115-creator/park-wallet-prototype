<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>企业在线支付 - 园区储值</title>
  <link rel="stylesheet" href="shared-styles.css">
  <style>
    .step.active { color: var(--info); background: var(--info-bg); }
    .panel { background: var(--card-bg); border-radius: 12px; padding: 18px; box-shadow: var(--shadow-card); }
    .panel h2 { margin: 0 0 6px; font-size: 17px; }
    .panel-intro { margin: 0 0 16px; color: var(--muted); font-size: 13px; }
    .channel-list { display: grid; gap: 10px; }
    .channel-item { padding: 13px 14px; border: 1px solid var(--border); border-radius: 10px; }
    .channel-item strong { display: block; font-size: 14px; }
    .channel-item small { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; }
    .channel-item input { margin-right: 8px; }
    .channel-item label { display: block; cursor: pointer; }
    .total { display: flex; justify-content: space-between; padding: 14px 0; font-weight: 700; }
    .notice { min-height: 42px; margin-top: 12px; padding: 11px 12px; border-radius: 8px; font-size: 13px; line-height: 1.5; }
    .notice:empty { display: none; }
    .notice.success { color: #177444; background: var(--success-bg); }
    .notice.error { color: #b42325; background: var(--error-bg); }
    .btn:disabled { cursor: not-allowed; opacity: .5; box-shadow: none; }
    @media (max-width: 980px) { .layout-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="brand">海智园区 · 企业管理</div>
      <nav>
        <a href="enterprise-overview.html">资金概览</a>
        <a href="enterprise-employees.html">员工账户</a>
        <a href="enterprise-recharge.html">在线充值</a>
        <a href="enterprise-batches.html">充值批次</a>
        <a href="enterprise-refunds.html">企业余额退款</a>
        <a href="enterprise-receipts.html">企业收据</a>
      </nav>
    </aside>
    <main class="admin-content">
      <div class="admin-header">
        <div><h1>企业在线支付</h1><p>选择支付渠道完成付款，付款成功后整批入账</p></div>
        <a href="enterprise-batches.html">查看充值批次</a>
      </div>
      <div class="step-strip" aria-label="充值步骤">
        <div class="step">1. 选择员工</div>
        <div class="step">2. 核对充值清单</div>
        <div class="step active">3. 在线支付</div>
      </div>
      <div class="layout-grid" style="display:grid;grid-template-columns:minmax(320px,.8fr) minmax(0,1.2fr);gap:18px;align-items:start;">
        <section class="panel">
          <h2>待支付批次</h2>
          <p class="panel-intro" id="batch-summary">-</p>
          <div class="total"><span>本批合计</span><span id="batch-total">¥0.00</span></div>
        </section>
        <section class="panel">
          <h2>支付渠道</h2>
          <p class="panel-intro">请选择一种企业支付渠道，确认后完成打款。</p>
          <div class="channel-list" id="channel-list"></div>
          <div class="action-row" style="margin-top:14px;">
            <button class="btn btn-primary btn-block" id="pay-confirm-btn" type="button">确认支付</button>
          </div>
          <div class="notice" id="payment-feedback" role="status" aria-live="polite"></div>
        </section>
      </div>
    </main>
  </div>
  <script src="shared-state.js"></script>
  <script>
    (function () {
      'use strict';
      const parkState = window.parkState;
      const channelList = document.getElementById('channel-list');
      const payConfirmBtn = document.getElementById('pay-confirm-btn');
      const feedback = document.getElementById('payment-feedback');
      let selectedChannel = 'enterprise-bank';

      function money(value) { return '¥' + Number(value || 0).toFixed(2); }
      function uniqueId(prefix) { return prefix + '-' + Date.now() + '-' + Math.random().toString(36).slice(2, 9); }
      function setFeedback(message, kind) { feedback.textContent = message; feedback.className = 'notice ' + kind; }

      function readDraft() {
        try {
          const raw = window.localStorage.getItem('parkEnterpriseRechargeDraft');
          const parsed = raw ? JSON.parse(raw) : null;
          return parsed && Array.isArray(parsed.items) && parsed.items.length ? parsed : null;
        } catch (error) { return null; }
      }

      function clearDraft() {
        try { window.localStorage.removeItem('parkEnterpriseRechargeDraft'); } catch (error) { /* 忽略 */ }
      }

      const draft = readDraft();
      const batch = draft && draft.batchId
        ? parkState.state.rechargeBatches.find(function (row) { return row.id === draft.batchId; })
        : null;

      const total = draft ? draft.items.reduce(function (sum, item) { return sum + Number(item.amount || 0); }, 0) : 0;
      const summaryText = document.getElementById('batch-summary');
      if (summaryText) {
        summaryText.textContent = batch
          ? '批次 ' + batch.id + '，共 ' + draft.items.length + ' 名员工，审核已通过，等待支付。'
          : '未找到待支付批次。';
      }
      const totalText = document.getElementById('batch-total');
      if (totalText) totalText.textContent = money(total);

      if (!draft || !batch) {
        channelList.textContent = '未找到待支付批次，请返回在线充值页面重新发起。';
        payConfirmBtn.disabled = true;
        payConfirmBtn.textContent = '暂无可支付批次';
      } else {
        const channels = [
          { id: 'enterprise-bank', name: '企业网银支付', detail: '实时到账，推荐' },
          { id: 'corporate-transfer', name: '对公账户转账', detail: '1 个工作日内到账' },
          { id: 'bank-connect', name: '银企直连', detail: '需已开通银企直连服务' }
        ];
        channels.forEach(function (channel, index) {
          const item = document.createElement('div');
          item.className = 'channel-item' + (index === 0 ? ' recommended' : '');
          const label = document.createElement('label');
          const input = document.createElement('input');
          input.type = 'radio';
          input.name = 'payment-channel';
          input.value = channel.id;
          input.checked = index === 0;
          const text = document.createElement('span');
          const title = document.createElement('strong');
          title.textContent = channel.name;
          const detail = document.createElement('small');
          detail.textContent = channel.detail;
          input.addEventListener('change', function () {
            selectedChannel = input.value;
            document.querySelectorAll('.channel-item').forEach(function (node) {
              node.classList.remove('recommended');
            });
            item.classList.add('recommended');
          });
          text.appendChild(title);
          text.appendChild(detail);
          label.appendChild(input);
          label.appendChild(text);
          item.appendChild(label);
          channelList.appendChild(item);
        });
        payConfirmBtn.disabled = false;
      }

      payConfirmBtn.addEventListener('click', function () {
        feedback.textContent = '';
        if (!draft || !batch) {
          setFeedback('未找到待支付批次，无法支付。', 'error');
          return;
        }
        payConfirmBtn.disabled = true;
        const confirmed = parkState.actions.confirmEnterpriseOnlinePayment(draft.batchId, uniqueId('PAY-WEB'));
        if (!confirmed.ok) {
          setFeedback('支付确认失败：' + confirmed.code + '。批次已保留，请稍后重试。', 'error');
          payConfirmBtn.disabled = false;
          return;
        }
        clearDraft();
        setFeedback('支付成功，批次 ' + draft.batchId + ' 已完成入账。', 'success');
        window.location.href = 'enterprise-batches.html';
      });
    })();
  </script>
</body>
</html>
