<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>充值清单审核 - 园区储值</title>
  <link rel="stylesheet" href="shared-styles.css">
  <style>
    .panel { background: var(--card-bg); border-radius: 12px; padding: 18px; box-shadow: var(--shadow-card); }
    .panel h2 { margin: 0 0 6px; font-size: 17px; }
    .panel-intro { margin: 0 0 16px; color: var(--muted); font-size: 13px; }
    .draft-list { display: grid; gap: 10px; white-space: pre-line; color: var(--ink); font-size: 13px; line-height: 1.7; }
    .draft-list:empty::after { content: '暂无待审核的充值明细'; color: var(--muted); }
    .total { display: flex; justify-content: space-between; padding: 14px 0; font-weight: 700; border-top: 1px solid var(--divider); margin-top: 14px; }
    .action-row { display: flex; gap: 10px; }
    .action-row .btn { border-radius: 9px; flex: 1; }
    .notice { min-height: 42px; margin-top: 12px; padding: 11px 12px; border-radius: 8px; font-size: 13px; line-height: 1.5; }
    .notice:empty { display: none; }
    .notice.success { color: #177444; background: var(--success-bg); }
    .notice.error { color: #b42325; background: var(--error-bg); }
    .btn:disabled { cursor: not-allowed; opacity: .5; box-shadow: none; }
  </style>
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="brand">海智园区 · 企业管理</div>
      <nav>
        <a href="enterprise-overview.html">资金概览</a>
        <a href="enterprise-employees.html">员工账户</a>
        <a class="active" href="enterprise-recharge.html">在线充值</a>
        <a href="enterprise-batches.html">充值批次</a>
        <a href="enterprise-refunds.html">企业余额退款</a>
        <a href="enterprise-receipts.html">企业收据</a>
      </nav>
    </aside>
    <main class="admin-content">
      <div class="admin-header">
        <div><h1>充值清单审核</h1><p>核对本次批量充值的人员与金额，审核通过后进入在线支付</p></div>
        <a href="enterprise-recharge.html">返回在线充值</a>
      </div>
      <div class="step-strip" aria-label="充值步骤">
        <div class="step">1. 选择员工</div>
        <div class="step active">2. 核对充值清单</div>
        <div class="step">3. 在线支付</div>
      </div>
      <section class="panel">
        <h2>待审核充值清单</h2>
        <p class="panel-intro">以下为本次批量充值的员工明细，请逐条核对后选择审核通过或驳回。</p>
        <div class="draft-list" id="draft-list"></div>
        <div class="total"><span>充值合计</span><span id="draft-total">¥0.00</span></div>
        <div class="action-row">
          <button class="btn btn-primary" id="approve-btn" type="button">审核通过，去支付</button>
          <button class="btn btn-white" id="reject-btn" type="button">驳回并返回</button>
        </div>
        <div class="notice" id="confirm-feedback" role="status" aria-live="polite"></div>
      </section>
    </main>
  </div>
  <script src="shared-state.js"></script>
  <script>
    (function () {
      'use strict';
      const parkState = window.parkState;
      const draftList = document.getElementById('draft-list');
      const draftTotal = document.getElementById('draft-total');
      const approveBtn = document.getElementById('approve-btn');
      const rejectBtn = document.getElementById('reject-btn');
      const feedback = document.getElementById('confirm-feedback');

      function money(value) { return '¥' + Number(value || 0).toFixed(2); }
      function setFeedback(message, kind) { feedback.textContent = message; feedback.className = 'notice ' + kind; }

      function readDraft() {
        try {
          const raw = window.localStorage.getItem('parkEnterpriseRechargeDraft');
          const parsed = raw ? JSON.parse(raw) : null;
          return parsed && Array.isArray(parsed.items) && parsed.items.length ? parsed : null;
        } catch (error) { return null; }
      }

      function clearDraft() {
        try { window.localStorage.removeItem('parkEnterpriseRechargeDraft'); } catch (error) { /* 忽略 */ }
      }

      function userName(userId) {
        const user = parkState.selectors.getUserById(userId);
        return user ? user.name : userId;
      }

      function userPhone(userId) {
        const user = parkState.selectors.getUserById(userId);
        return user && user.phone ? user.phone : '';
      }

      const draft = readDraft();
      const hasBatch = Boolean(draft && draft.batchId);
      if (!draft) {
        draftList.textContent = '暂无待审核的充值清单，请返回在线充值页面重新发起。';
        draftTotal.textContent = money(0);
        approveBtn.disabled = true;
        approveBtn.textContent = '暂无待审核清单';
        rejectBtn.disabled = true;
      } else {
        const lines = draft.items.map(function (item) {
          const phone = userPhone(item.userId);
          return item.userId + ' ' + userName(item.userId) + (phone ? '（' + phone + '）' : '') + ' 充值 ' + money(item.amount);
        });
        draftList.textContent = lines.join('\n');
        const total = draft.items.reduce(function (sum, item) { return sum + Number(item.amount || 0); }, 0);
        draftTotal.textContent = money(total);
        if (hasBatch) {
          approveBtn.disabled = true;
          approveBtn.textContent = '已审核，前往在线支付';
          rejectBtn.disabled = true;
          setFeedback('该充值清单已创建批次，请前往在线支付完成打款。', 'success');
        }
      }

      approveBtn.addEventListener('click', function () {
        feedback.textContent = '';
        const current = readDraft();
        if (!current) {
          setFeedback('草稿已失效，请返回在线充值页面重新发起。', 'error');
          return;
        }
        approveBtn.disabled = true;
        const created = parkState.actions.createEnterpriseRecharge({
          enterpriseId: current.enterpriseId,
          rechargeParkId: current.rechargeParkId,
          method: 'online',
          requestId: current.requestId,
          items: current.items
        });
        if (!created.ok) {
          setFeedback('充值批次创建失败：' + created.code + '。请核对员工和金额后重试。', 'error');
          approveBtn.disabled = false;
          return;
        }
        current.batchId = created.data.id;
        try { window.localStorage.setItem('parkEnterpriseRechargeDraft', JSON.stringify(current)); } catch (error) { /* 忽略 */ }
        setFeedback('审核通过，批次 ' + created.data.id + ' 已创建，正在前往在线支付。', 'success');
        window.location.href = 'enterprise-payment.html';
      });

      rejectBtn.addEventListener('click', function () {
        feedback.textContent = '';
        clearDraft();
        setFeedback('已驳回本次充值清单，返回在线充值页面。', 'success');
        window.location.href = 'enterprise-recharge.html';
      });
    })();
  </script>
</body>
</html>
