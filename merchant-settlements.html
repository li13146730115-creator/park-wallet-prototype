<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>分账管理 - 海智咖啡 HUB</title>
  <link rel="stylesheet" href="shared-styles.css">
  <style>
    .app-content{padding:0 var(--page-padding) 18px}.metrics-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.metric-card{background:var(--card-bg);border-radius:var(--radius-card);box-shadow:var(--shadow-card);padding:16px 12px;text-align:center}.metric-card span{display:block;color:var(--muted);font-size:12px}.metric-card b{display:block;margin-top:6px;font-size:18px}.flow-panel{background:var(--card-bg);border-radius:var(--radius-card);box-shadow:var(--shadow-card);padding:16px 14px;margin-bottom:14px}.flow-panel h2{margin:0 0 12px;font-size:16px}.filter-chips{display:flex;flex-wrap:nowrap;gap:8px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}.filter-chips button{flex:0 0 auto;border:1px solid var(--border);border-radius:var(--radius-pill);background:var(--card-bg);color:var(--muted);padding:7px 14px}.filter-chips button.active{border-color:var(--primary);background:var(--primary-soft);color:var(--primary);font-weight:600}.flow-cards{display:grid;gap:10px}.flow-card{border:1px solid var(--border);border-radius:var(--radius-small);padding:13px 12px}.flow-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.flow-order{min-width:0;overflow-wrap:anywhere;color:var(--muted);font-size:12px}.flow-head .tag{flex:0 0 auto}.tag-pending{background:var(--warning-bg);color:var(--warning)}.flow-name{margin-top:8px;font-size:15px;font-weight:600}.flow-money{display:flex;justify-content:space-between;gap:12px;margin-top:10px;padding:10px 0;border-top:1px solid var(--divider);border-bottom:1px solid var(--divider);font-size:13px;font-weight:600}.flow-details{padding-top:6px}.detail-row{display:flex;justify-content:space-between;gap:12px;padding-top:6px;color:var(--muted);font-size:12px}.detail-row span:last-child{color:var(--ink);text-align:right;overflow-wrap:anywhere}.empty-state{padding:24px 0;text-align:center;color:var(--muted)}
  </style>
</head>
<body>
  <div class="mobile-page"><div class="phone-shell"><div class="status-bar"><span>9:41</span><span class="status-icons"><span class="signal"><i></i><i></i><i></i><i></i></span><span>5G</span><span class="battery"><b></b></span></span></div><div class="app-shell">
    <header class="topbar"><a href="merchant-home.html" class="back">‹</a><strong>分账管理</strong><span></span></header>
    <main class="app-content">
      <section class="metrics-grid" aria-label="本月核心指标">
        <div class="metric-card"><span>本月订单数量</span><b id="month-order-count">0</b></div>
        <div class="metric-card"><span>本月收入金额</span><b id="month-income">¥0.00</b></div>
        <div class="metric-card"><span>本月分账金额</span><b id="month-share">¥0.00</b></div>
        <div class="metric-card"><span>本月退款金额</span><b id="month-refund">¥0.00</b></div>
      </section>
      <section class="flow-panel">
        <h2>分账流水</h2>
        <div id="settlement-filter" class="filter-chips" aria-label="分账状态">
          <button class="active" data-status="all">全部</button>
          <button data-status="settled">已分账</button>
          <button data-status="pending">待分账</button>
        </div>
        <div id="flow-list" class="flow-cards"></div>
      </section>
    </main>
    <div class="home-bar"></div>
  </div></div></div>
  <script src="shared-state.js"></script>
  <script>
  (function(){
    'use strict';
    const MERCHANT_ID='M002',NOW=new Date(),CURRENT_MONTH=NOW.getFullYear()+'-'+String(NOW.getMonth()+1).padStart(2,'0'),user=parkState.state.user,orders=parkState.state.orders,config=parkState.state.merchantConfig[MERCHANT_ID]||{name:'海智咖啡 HUB',ratio:0.8},transactions=parkState.state.transactions,pendingSettlements=parkState.state.pendingSettlements;
    let flowFilter='all';
    function isCurrentMonth(order){return String(order.createdAt||'').slice(0,7)===CURRENT_MONTH}
    function merchantOrders(){return orders.filter(o=>o.merchantId===MERCHANT_ID)}
    function currentMonthOrders(){return merchantOrders().filter(isCurrentMonth)}
    function renderMetrics(){
      const monthly=currentMonthOrders();
      document.getElementById('month-order-count').textContent=monthly.length;
      const income=monthly.filter(o=>o.paymentStatus==='paid').reduce((sum,o)=>sum+Number(o.amount),0);
      document.getElementById('month-income').textContent='¥'+formatMoney(income);
      const share=monthly.filter(o=>o.paymentStatus==='paid').reduce((sum,o)=>sum+Number(o.amount)*config.ratio,0);
      document.getElementById('month-share').textContent='¥'+formatMoney(share);
      const refund=monthly.filter(o=>o.refundStatus==='refunded').reduce((sum,o)=>sum+Number(o.amount),0);
      document.getElementById('month-refund').textContent='¥'+formatMoney(refund);
    }
    function maskName(value){const text=String(value||'').trim();if(!text)return '未填写';if(/\*{2,}/.test(text)||text.length===1)return text;return text.charAt(0)+'***'+text.charAt(text.length-1)}
    function maskPhone(value){const text=String(value||'').trim();if(!text)return '未填写';if(text.includes('*'))return text;return /^\d{11}$/.test(text)?text.slice(0,3)+'****'+text.slice(-4):text}
    function successfulSettlement(orderId){return pendingSettlements.filter(item=>item.status==='success'&&Array.isArray(item.orderIds)&&item.orderIds.includes(orderId)).sort((a,b)=>String(b.paymentRecordedAt||'').localeCompare(String(a.paymentRecordedAt||'')))[0]||null}
    function transactionName(order){return config.name+' 消费'}
    function flowRows(){
      return merchantOrders().filter(order=>order.paymentStatus==='paid').map(order=>{
        const settlement=successfulSettlement(order.id),status=settlement?'settled':'pending';
        return {order,status,label:status==='settled'?'已分账':'待分账',name:transactionName(order),userInfo:maskName(user.name)+'_'+maskPhone(user.phone),share:Number(order.amount)*config.ratio,settledAt:settlement?(settlement.paymentRecordedAt||'时间未记录'):'待分账'};
      }).filter(row=>flowFilter==='all'||row.status===flowFilter).sort((a,b)=>String(b.order.createdAt||'').localeCompare(String(a.order.createdAt||'')));
    }
    function addText(parent,className,text,tagName){const element=document.createElement(tagName||'div');element.className=className;element.textContent=text;parent.appendChild(element);return element}
    function addDetailRow(parent,label,value){const row=document.createElement('div');row.className='detail-row';addText(row,'',label,'span');addText(row,'',value,'span');parent.appendChild(row)}
    function renderFlow(){
      const list=document.getElementById('flow-list'),rows=flowRows();list.replaceChildren();
      if(!rows.length){const messages={all:'暂无分账流水',settled:'暂无已分账流水',pending:'暂无待分账流水'};addText(list,'empty-state',messages[flowFilter]);return}
      rows.forEach(row=>{
        const card=document.createElement('div'),head=document.createElement('div'),money=document.createElement('div'),details=document.createElement('div');
        card.className='flow-card';card.setAttribute('data-order-id',row.order.id);head.className='flow-head';money.className='flow-money';details.className='flow-details';
        addText(head,'flow-order',row.order.id);addText(head,'tag '+(row.status==='settled'?'tag-success':'tag-pending'),row.label,'span');card.appendChild(head);
        addText(card,'flow-name',row.name);addText(money,'','订单金额 ¥'+formatMoney(row.order.amount),'span');addText(money,'','分账金额 ¥'+formatMoney(row.share),'span');card.appendChild(money);
        addDetailRow(details,'用户信息',row.userInfo);addDetailRow(details,'交易时间',row.order.createdAt||'-');addDetailRow(details,'分账时间',row.settledAt);card.appendChild(details);list.appendChild(card);
      });
    }
    document.querySelectorAll('#settlement-filter button').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('#settlement-filter button').forEach(item=>item.classList.toggle('active',item===button));flowFilter=button.dataset.status;renderFlow()}));
    renderMetrics();renderFlow();
  })();
  </script>
  <script src="shared-nav.js"></script>
</body>
</html>
