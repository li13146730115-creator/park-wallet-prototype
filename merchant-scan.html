<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>扫码收款</title>
  <link rel="stylesheet" href="shared-styles.css">
  <style>
    .app-content { padding: 0 var(--page-padding) 18px; }
    .screen[hidden] { display: none; }

    .scan-hero {
      border-radius: 0 0 var(--radius-card) var(--radius-card);
      margin: 0 calc(-1 * var(--page-padding)) 14px;
      padding: 20px 18px 28px;
      color: #fff;
      background: var(--gradient-hero);
      position: relative;
      overflow: hidden;
      text-align: center;
    }
    .scan-hero::before,
    .scan-hero::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.18);
    }
    .scan-hero::before { width: 260px; height: 260px; right: -110px; top: -130px; }
    .scan-hero::after { width: 150px; height: 150px; left: -65px; bottom: -95px; }
    .scan-title { position: relative; z-index: 2; font-size: 14px; opacity: 0.88; margin-bottom: 16px; }
    .scan-frame {
      position: relative;
      z-index: 2;
      width: 220px;
      height: 220px;
      margin: 0 auto;
      border: 2px dashed rgba(255, 255, 255, 0.5);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.08);
      display: grid;
      place-items: center;
    }
    .scan-frame svg { width: 64px; height: 64px; opacity: 0.85; }
    .scan-hint { position: relative; z-index: 2; font-size: 13px; opacity: 0.82; margin-top: 16px; }
    .scan-actions { padding: 8px 0 0; }
    .scan-actions .btn { width: 100%; height: 54px; font-size: 17px; font-weight: 750; }

    .detail-card {
      background: var(--card-bg);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-card);
      padding: 18px 16px 18px;
      margin-top: 14px;
    }
    .detail-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--divider);
    }
    .detail-badge {
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--info-bg);
      color: var(--info);
      font-size: 11px;
      font-weight: 650;
    }
    .detail-head span { color: var(--muted); font-size: 12px; }
    .detail-rows .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--divider);
      font-size: 14px;
    }
    .detail-rows .row:last-child { border-bottom: 0; }
    .detail-rows .row label { color: var(--muted); }
    .detail-rows .row value { color: var(--ink); font-weight: 650; }
    .detail-rows .row value.deduct { color: var(--error); }
    .receive-block {
      margin: 14px 0 18px;
      padding: 14px;
      border-radius: var(--radius-small);
      background: var(--info-bg);
      text-align: center;
    }
    .receive-block label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    .receive-value { font-size: 34px; font-weight: 700; color: var(--ink); line-height: 1.1; }
    .receive-value small { font-size: 18px; margin-right: 2px; }
    .detail-actions { display: grid; gap: 10px; }
    .detail-actions .btn { height: 50px; font-size: 16px; font-weight: 750; }
    .detail-tip { margin-top: 12px; color: var(--muted); font-size: 12px; line-height: 1.6; text-align: center; }

    .empty-card {
      background: var(--card-bg);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-card);
      padding: 44px 20px 32px;
      margin-top: 14px;
      text-align: center;
    }
    .empty-icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      margin: 0 auto 14px;
      background: var(--page-bg);
      color: var(--muted);
    }
    .empty-icon svg { width: 30px; height: 30px; }
    .empty-title { font-size: 17px; font-weight: 700; color: var(--ink); margin-bottom: 8px; }
    .empty-text { font-size: 13px; color: var(--muted); line-height: 1.7; margin-bottom: 22px; }
    .empty-card .btn { width: 100%; height: 48px; font-size: 15px; font-weight: 700; }

    .result-card {
      background: var(--card-bg);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-card);
      padding: 36px 20px 24px;
      margin-top: 14px;
      text-align: center;
    }
    .result-icon {
      width: 74px;
      height: 74px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      margin: 0 auto 16px;
      font-size: 38px;
    }
    .result-icon.success { background: var(--success-bg); color: var(--success); }
    .result-icon.fail { background: var(--error-bg); color: var(--error); }
    .result-title { font-size: 20px; font-weight: 700; color: var(--ink); margin-bottom: 6px; }
    .result-subtitle { font-size: 14px; color: var(--muted); margin-bottom: 24px; }
    .result-detail { background: var(--page-bg); border-radius: 12px; padding: 16px; margin-bottom: 24px; text-align: left; }
    .result-detail .row { display: flex; justify-content: space-between; padding: 8px 0; font-size: 14px; }
    .result-detail .row label { color: var(--muted); }
    .result-detail .row value { color: var(--ink); font-weight: 650; }
    .result-actions .btn { width: 100%; height: 48px; font-size: 15px; font-weight: 700; }
  </style>
</head>
<body>
  <div class="mobile-page">
    <div class="phone-shell">
      <div class="status-bar">
        <span>9:41</span>
        <span class="status-icons">
          <span class="signal"><i></i><i></i><i></i><i></i></span>
          <span>5G</span>
          <span class="battery"><b></b></span>
        </span>
      </div>
      <div class="app-shell">
        <header class="topbar">
          <a href="merchant-home.html" class="back">‹</a>
          <strong>扫码收款</strong>
          <span class="more"><a href="merchant-settlements.html" style="font-size:13px;letter-spacing:0;text-decoration:none;color:var(--info);font-weight:600;">分账管理</a></span>
        </header>
        <main class="app-content">
          <section id="scan-screen" class="screen">
            <div class="scan-hero">
              <div class="scan-title">扫描用户付款码</div>
              <div class="scan-frame">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                  <rect x="2" y="2" width="20" height="20" rx="6"></rect>
                  <path d="M2 12h20"></path>
                </svg>
              </div>
              <div class="scan-hint">将取景框对准用户付款码</div>
            </div>
            <div class="scan-actions">
              <button class="btn btn-primary" id="scan-btn">扫码收款</button>
            </div>
          </section>

          <section id="detail-screen" class="screen" hidden>
            <div class="detail-card">
              <div class="detail-head">
                <span class="detail-badge">待支付单</span>
                <span>用户已发起付款</span>
              </div>
              <div class="detail-rows">
                <div class="row">
                  <label>订单金额</label>
                  <value>¥<span id="detail-order-amount">0.00</span></value>
                </div>
                <div class="row">
                  <label>优惠券抵扣</label>
                  <value class="deduct">-¥<span id="detail-coupon-amount">0.00</span></value>
                </div>
              </div>
              <div class="receive-block">
                <label>实际收款</label>
                <div class="receive-value"><small>¥</small><span id="detail-receive-amount">0.00</span></div>
              </div>
              <div class="detail-actions">
                <button class="btn btn-primary" id="confirm-btn" type="button">确认收款</button>
                <a class="btn btn-white" href="merchant-home.html">取消</a>
              </div>
              <p class="detail-tip">收款金额已按优惠券抵扣后的折后金额计算，确认后将从用户储值余额中扣除。</p>
            </div>
          </section>

          <section id="empty-screen" class="screen" hidden>
            <div class="empty-card">
              <div class="empty-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
                  <rect x="3" y="3" width="18" height="18" rx="4"></rect>
                  <path d="M8 12h8"></path>
                </svg>
              </div>
              <div class="empty-title">未读取到待支付单</div>
              <div class="empty-text">请让用户先在「付款码」页面输入订单金额、选择优惠券并发起付款，生成付款码后再扫码收款。</div>
              <a class="btn btn-primary" href="merchant-home.html">知道了</a>
            </div>
          </section>

          <section id="result-screen" class="screen" hidden>
            <div class="result-card">
              <div class="result-icon success" id="result-icon">✓</div>
              <div class="result-title" id="result-title">收款成功</div>
              <div class="result-subtitle" id="result-subtitle">-</div>
              <div class="result-detail">
                <div class="row">
                  <label>收款金额</label>
                  <value id="result-amount">-</value>
                </div>
                <div class="row">
                  <label>收款时间</label>
                  <value id="result-time">-</value>
                </div>
              </div>
              <div class="result-actions">
                <a href="merchant-home.html" class="btn btn-primary" id="result-done-btn">完成</a>
              </div>
            </div>
          </section>
        </main>
        <nav class="bottom-nav">
          <a href="merchant-home.html" class="nav-item active">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            首页
          </a>
          <div class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><rect x="2" y="3" width="20" height="14" rx="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
            服务
          </div>
          <div class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M12 2l9 4.9V17L12 22l-9-4.9V7z"></path></svg>
            领福利
          </div>
          <div class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
            客服
          </div>
          <div class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            我的
          </div>
        </nav>
        <div class="home-bar"></div>
      </div>
    </div>
  </div>
  <script src="shared-state.js"></script>
  <script>
    (function () {
      'use strict';
      const PARK_ID = 'park-001';
      const MERCHANT_ID = 'M002';
      const els = {
        scanScreen: document.getElementById('scan-screen'),
        detailScreen: document.getElementById('detail-screen'),
        resultScreen: document.getElementById('result-screen'),
        emptyScreen: document.getElementById('empty-screen'),
        scanBtn: document.getElementById('scan-btn'),
        orderAmount: document.getElementById('detail-order-amount'),
        couponAmount: document.getElementById('detail-coupon-amount'),
        receiveAmount: document.getElementById('detail-receive-amount'),
        confirmBtn: document.getElementById('confirm-btn'),
        resultIcon: document.getElementById('result-icon'),
        resultTitle: document.getElementById('result-title'),
        resultSubtitle: document.getElementById('result-subtitle'),
        resultAmount: document.getElementById('result-amount'),
        resultTime: document.getElementById('result-time')
      };
      const screens = [els.scanScreen, els.detailScreen, els.resultScreen, els.emptyScreen];

      let pending = null;

      function showScreen(target) {
        screens.forEach(function (screen) { screen.hidden = screen !== target; });
      }

      function readPending() {
        try {
          const raw = window.localStorage.getItem('parkPendingPayment');
          const parsed = raw ? JSON.parse(raw) : null;
          return parsed && parsed.userId && typeof parsed.payable === 'number' ? parsed : null;
        } catch (error) {
          return null;
        }
      }

      function clearPending() {
        try { window.localStorage.removeItem('parkPendingPayment'); } catch (error) { /* 存储不可用时忽略 */ }
      }

      function formatTime(date) {
        const y = date.getFullYear();
        const m = String(date.getMonth() + 1).padStart(2, '0');
        const d = String(date.getDate()).padStart(2, '0');
        const h = String(date.getHours()).padStart(2, '0');
        const min = String(date.getMinutes()).padStart(2, '0');
        return y + '-' + m + '-' + d + ' ' + h + ':' + min;
      }

      function showDetail(payment) {
        els.orderAmount.textContent = formatMoney(payment.orderAmount);
        els.couponAmount.textContent = formatMoney(payment.couponAmount || 0);
        els.receiveAmount.textContent = formatMoney(payment.payable);
        showScreen(els.detailScreen);
      }

      function confirmCollection() {
        if (!pending) return;
        const collectResult = parkState.actions.collectPayment({
          parkId: PARK_ID,
          userId: pending.userId,
          merchantId: MERCHANT_ID,
          amount: pending.payable,
          couponId: pending.couponId || undefined,
          requestId: pending.requestId
        });
        if (collectResult.ok) {
          clearPending();
          showResult(true, '已按折后金额入账', pending.payable);
        } else {
          const message = collectResult.code === 'INSUFFICIENT_BALANCE' ? '用户余额不足，收款失败' : '收款失败：' + collectResult.code;
          showResult(false, message, pending.payable);
        }
      }

      function showResult(success, subtitle, amount) {
        showScreen(els.resultScreen);
        els.resultIcon.className = 'result-icon ' + (success ? 'success' : 'fail');
        els.resultIcon.textContent = success ? '✓' : '✕';
        els.resultTitle.textContent = success ? '收款成功' : '收款失败';
        els.resultSubtitle.textContent = subtitle;
        els.resultAmount.textContent = '¥' + formatMoney(amount);
        els.resultTime.textContent = formatTime(new Date());
      }

      els.scanBtn.addEventListener('click', function () {
        pending = readPending();
        if (pending) showDetail(pending);
        else showScreen(els.emptyScreen);
      });
      els.confirmBtn.addEventListener('click', confirmCollection);

      showScreen(els.scanScreen);
    })();
  </script>
  <script src="shared-nav.js"></script>
</body>
</html>
