<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>园区储值新版测试运行器</title>
  <link rel="stylesheet" href="shared-styles.css">
  <style>
    .test-page { min-height: 100vh; padding: 0 var(--page-padding) 80px; background: var(--page-bg); }
    .test-header { margin: 0 calc(-1 * var(--page-padding)) 16px; padding: 24px 20px; color: #fff; text-align: center; background: var(--gradient-hero); }
    .test-header h1 { margin: 0 0 5px; font-size: 20px; }
    .test-header p { margin: 0; font-size: 12px; opacity: .88; }
    .summary { display: flex; justify-content: center; gap: 16px; margin-bottom: 16px; }
    .summary-item { min-width: 92px; padding: 12px 20px; text-align: center; background: var(--card-bg); border-radius: 12px; box-shadow: var(--shadow-card); }
    .summary-item b { display: block; color: var(--ink); font-size: 22px; }
    .summary-item span { color: var(--muted); font-size: 12px; }
    .test-list { display: grid; gap: 10px; }
    .test-item { padding: 14px 16px; background: var(--card-bg); border-radius: var(--radius-small); box-shadow: var(--shadow-card); }
    .test-item header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .test-title { color: var(--ink); font-size: 14px; font-weight: 650; }
    .test-badge { flex: none; padding: 4px 10px; border-radius: 10px; font-size: 12px; font-weight: 700; }
    .test-badge.pass { color: var(--success); background: var(--success-bg); }
    .test-badge.fail { color: var(--error); background: var(--error-bg); }
    .test-message { display: none; margin-top: 8px; padding: 8px 10px; color: var(--error); background: var(--error-bg); border-radius: 8px; font-size: 12px; line-height: 1.5; }
    .test-message.show { display: block; }
    .actions { display: flex; flex-direction: column; align-items: center; gap: 12px; margin-top: 24px; }
    .reset-btn { width: 100%; max-width: 320px; height: 46px; border: 0; border-radius: var(--radius-button); color: #fff; background: var(--error); font: 700 15px inherit; cursor: pointer; }
    .back-link { padding: 10px 18px; color: var(--info); background: var(--card-bg); border-radius: var(--radius-pill); box-shadow: var(--shadow-card); font-size: 13px; font-weight: 600; text-decoration: none; }
    @media (min-width: 768px) { .test-page { max-width: 680px; margin: 0 auto; } .test-header { border-radius: 0 0 var(--radius-card) var(--radius-card); } }
  </style>
</head>
<body>
  <main class="test-page">
    <header class="test-header">
      <h1>园区储值新版测试运行器</h1>
      <p>双余额 · 企业整批充值 · 跨园区消费 · 原路退款</p>
    </header>

    <section class="summary" aria-label="测试汇总">
      <div class="summary-item"><b id="passCount">0</b><span>通过</span></div>
      <div class="summary-item"><b id="failCount">0</b><span>失败</span></div>
    </section>

    <section class="test-list" id="testList"></section>

    <div class="actions">
      <button class="reset-btn" id="resetButton" type="button">重置状态并重跑</button>
      <a class="back-link" href="index.html">返回原型首页</a>
    </div>
  </main>

  <script src="shared-state.js"></script>
  <script>
    (function () {
      'use strict';

      const tests = [];
      let passCount = 0;
      let failCount = 0;

      function test(name, fn) { tests.push({ name: name, fn: fn }); }
      function assert(condition, message) { if (!condition) throw new Error(message || '断言失败'); }
      function assertEqual(actual, expected, message) {
        if (actual !== expected) throw new Error((message || '断言失败') + '：期望 ' + expected + '，实际 ' + actual);
      }
      function assertApprox(actual, expected, message) {
        if (Math.abs(actual - expected) > 0.001) throw new Error((message || '断言失败') + '：期望 ' + expected + '，实际 ' + actual);
      }
      function resetToDefaults() { parkState.resetForTests(); }
      function account() { return parkState.selectors.getAccountByUser('U001'); }
      function enterpriseBalance() {
        const current = account();
        assert(current && current.enterpriseBalances && current.enterpriseBalances.length, '缺少默认企业余额');
        return current.enterpriseBalances[0];
      }
      function parkTwoMerchant() {
        const merchant = parkState.state.merchants.find(function (item) { return item.parkId === 'park-002'; });
        assert(merchant, '缺少园区二商户');
        return merchant;
      }

      function snapshotStorage() {
        return {
          parkStateV2: localStorage.getItem('parkStateV2'),
          parkStateV2Version: localStorage.getItem('parkStateV2Version'),
          parkV2AdminPark: localStorage.getItem('parkV2AdminPark')
        };
      }

      function restoreStorage(snapshot) {
        Object.keys(snapshot).forEach(function (key) {
          if (snapshot[key] === null) localStorage.removeItem(key);
          else localStorage.setItem(key, snapshot[key]);
        });
      }

      test('新版状态包含企业、双余额和充值批次', function () {
        resetToDefaults();
        assert(Array.isArray(parkState.state.enterprises), '缺少 enterprises');
        assert(Array.isArray(parkState.state.rechargeBatches), '缺少 rechargeBatches');
        assert(Array.isArray(parkState.state.rechargeBatchItems), '缺少 rechargeBatchItems');
        assert(account().personal && Array.isArray(account().enterpriseBalances), '账户未拆分双余额');
      });

      test('个人充值只增加个人余额', function () {
        resetToDefaults();
        const current = account();
        const enterprise = enterpriseBalance();
        const personalBefore = current.personal.available;
        const enterpriseBefore = enterprise.available;
        const response = parkState.actions.rechargePersonal({ userId: 'U001', parkId: 'park-001', amount: 50, requestId: 'BROWSER-PR-1' });
        assert(response.ok, '个人充值失败：' + response.code);
        assertApprox(current.personal.available, personalBefore + 50, '个人余额');
        assertApprox(enterprise.available, enterpriseBefore, '企业余额不得变化');
      });

      test('个人充值幂等重试在收据缺失时拒绝', function () {
        resetToDefaults();
        const input = { userId: 'U001', parkId: 'park-001', amount: 20, requestId: 'BROWSER-PR-IDEMPOTENT-TAMPER' };
        const first = parkState.actions.rechargePersonal(input);
        assert(first.ok, '个人充值准备失败');
        const legalReplay = parkState.actions.rechargePersonal(input);
        assert(legalReplay.ok && legalReplay.idempotent, '未篡改重试应保持幂等');
        parkState.state.invoiceRecords = parkState.state.invoiceRecords.filter(function (item) { return item.sourceId !== first.data.id; });
        assert(!parkState.internals.isValidState(JSON.parse(JSON.stringify(parkState.state))), '缺失收据状态应无效');
        const tamperedReplay = parkState.actions.rechargePersonal(input);
        assert(!tamperedReplay.ok && !tamperedReplay.idempotent, '收据缺失后不得幂等成功');
      });

      test('企业在线充值逐行记录入账状态并拒绝篡改', function () {
        resetToDefaults();
        const enterprise = enterpriseBalance();
        const before = enterprise.available;
        const created = parkState.actions.createEnterpriseRecharge({
          enterpriseId: enterprise.enterpriseId,
          rechargeParkId: 'park-001',
          method: 'online',
          requestId: 'BROWSER-ER-1',
          items: [{ userId: 'U001', amount: 100 }, { userId: 'U004', amount: 50 }]
        });
        assert(created.ok, '创建企业批次失败：' + created.code);
        const items = parkState.state.rechargeBatchItems.filter(function (item) { return item.batchId === created.data.id; });
        assertEqual(items.length, 2, '批次明细数');
        assert(items.every(function (item) { return item.postingStatus === 'pending'; }), '支付前逐行状态应为 pending');
        assertApprox(enterprise.available, before, '支付前不得入账');
        const first = parkState.actions.confirmEnterpriseOnlinePayment(created.data.id, 'BROWSER-PAY-1');
        const replay = parkState.actions.confirmEnterpriseOnlinePayment(created.data.id, 'BROWSER-PAY-1');
        assert(first.ok && replay.ok && replay.idempotent, '重复支付回调应幂等');
        assert(items.every(function (item) { return item.postingStatus === 'succeeded'; }), '支付后逐行状态应为 succeeded');
        assertApprox(enterprise.available, before + 100, '企业余额只增加一次');
        const tampered = JSON.parse(JSON.stringify(parkState.state));
        tampered.rechargeBatchItems.find(function (item) { return item.batchId === created.data.id; }).postingStatus = 'pending';
        assert(!parkState.internals.isValidState(tampered), '成功明细状态被篡改时应拒绝');
      });

      test('在线和线下批次直接入账缺少支付依据时拒绝', function () {
        ['online', 'offline'].forEach(function (method) {
          resetToDefaults();
          const before = enterpriseBalance().available;
          const created = parkState.actions.createEnterpriseRecharge({
            enterpriseId: 'E001', rechargeParkId: 'park-001', method: method,
            requestId: 'BROWSER-DIRECT-' + method, items: [{ userId: 'U001', amount: 18 }]
          });
          assert(created.ok, method + ' 批次创建失败');
          created.data.paymentStatus = 'succeeded';
          const posted = parkState.actions.postRechargeBatch(created.data.id);
          assert(!posted.ok, method + ' 缺少支付依据不得入账');
          assertApprox(enterpriseBalance().available, before, method + ' 余额不得变化');
        });
      });

      test('待入账明细 enterpriseId 篡改时拒绝', function () {
        resetToDefaults();
        const before = enterpriseBalance().available;
        const created = parkState.actions.createEnterpriseRecharge({
          enterpriseId: 'E001', rechargeParkId: 'park-001', method: 'online',
          requestId: 'BROWSER-TAMPER-PENDING', items: [{ userId: 'U001', amount: 19 }]
        });
        const item = parkState.state.rechargeBatchItems.find(function (candidate) { return candidate.batchId === created.data.id; });
        item.enterpriseId = 'E002';
        created.data.paymentStatus = 'succeeded';
        created.data.paymentReference = 'BROWSER-PAY-TAMPER';
        const posted = parkState.actions.postRechargeBatch(created.data.id);
        assert(!posted.ok && posted.code === 'BATCH_VALIDATION_FAILED', '篡改明细应拒绝');
        assertApprox(enterpriseBalance().available, before, '篡改明细不得入账');
      });

      test('线下凭证确认成功且重复确认幂等', function () {
        resetToDefaults();
        const before = enterpriseBalance().available;
        const created = parkState.actions.createEnterpriseRecharge({
          enterpriseId: 'E001', rechargeParkId: 'park-001', method: 'offline',
          requestId: 'BROWSER-OFFLINE', items: [{ userId: 'U001', amount: 40 }]
        });
        const first = parkState.actions.confirmOfflineRecharge(created.data.id, 'browser-voucher.pdf');
        const replay = parkState.actions.confirmOfflineRecharge(created.data.id, 'browser-voucher.pdf');
        assert(first.ok && replay.ok && replay.idempotent, '线下凭证确认及幂等失败');
        assertApprox(enterpriseBalance().available, before + 40, '线下充值只入账一次');
      });

      test('非法企业批次记录 validation_failed 和全部明细且不入账', function () {
        resetToDefaults();
        const before = JSON.stringify(parkState.state.accounts);
        const response = parkState.actions.createEnterpriseRecharge({
          enterpriseId: 'E001', rechargeParkId: 'park-001', method: 'online', requestId: 'BROWSER-ER-INVALID',
          items: [{ userId: 'U001', amount: 100 }, { userId: 'UNKNOWN', amount: 50 }]
        });
        assert(!response.ok && response.code === 'BATCH_VALIDATION_FAILED', '非法批次应失败');
        const batch = parkState.state.rechargeBatches.find(function (item) { return item.requestId === 'BROWSER-ER-INVALID'; });
        assert(batch && batch.status === 'validation_failed' && batch.validationStatus === 'failed', '应记录 validation_failed 批次');
        const items = parkState.state.rechargeBatchItems.filter(function (item) { return item.batchId === batch.id; });
        assertEqual(items.length, 2, '应记录全部明细');
        assert(items.every(function (item) { return Array.isArray(item.validationResult) && item.validationResult.length; }), '应记录逐行校验结果');
        assert(items.every(function (item) { return item.postingStatus === 'not_posted'; }), '校验失败明细应明确为 not_posted');
        const tampered = JSON.parse(JSON.stringify(parkState.state));
        tampered.rechargeBatchItems[0].postingStatus = 'succeeded';
        assert(!parkState.internals.isValidState(tampered), '校验失败明细不得标记为 succeeded');
        assertEqual(JSON.stringify(parkState.state.accounts), before, '失败批次不得改变余额');
      });

      test('字段非法的企业充值明细仍记录失败批次', function () {
        resetToDefaults();
        const beforeAccounts = JSON.stringify(parkState.state.accounts);
        const response = parkState.actions.createEnterpriseRecharge({
          enterpriseId: 'E001', rechargeParkId: 'park-001', method: 'online', requestId: 'BROWSER-INVALID-DETAIL',
          items: [{ userId: '', amount: 10 }]
        });
        assert(!response.ok && response.code === 'BATCH_VALIDATION_FAILED', '字段非法明细应返回 BATCH_VALIDATION_FAILED');
        const batch = parkState.state.rechargeBatches.find(function (item) { return item.requestId === 'BROWSER-INVALID-DETAIL'; });
        assert(batch && batch.status === 'validation_failed', '字段非法明细应持久化失败批次');
        const items = parkState.state.rechargeBatchItems.filter(function (item) { return item.batchId === batch.id; });
        assertEqual(items.length, 1, '字段非法明细应保留一条记录');
        assert(items[0].userId === null && items[0].amount === 10, '失败明细应规范化 userId 和金额');
        assert(items[0].postingStatus === 'not_posted', '失败明细应为 not_posted');
        assert(items[0].rawItem && items[0].rawItem.userId === '', '失败明细应保留原始输入');
        assert(items[0].validationResult.indexOf('invalid_user_id') >= 0, '应记录逐行 userId 错误');
        assertEqual(JSON.stringify(parkState.state.accounts), beforeAccounts, '字段非法明细不得改变余额');
        parkState.reloadForTests();
        assert(parkState.state.rechargeBatches.some(function (item) { return item.requestId === 'BROWSER-INVALID-DETAIL'; }), '重载后应保留失败批次');
      });

      test('成功企业批次被篡改后重试拒绝', function () {
        resetToDefaults();
        const created = parkState.actions.createEnterpriseRecharge({
          enterpriseId: 'E001', rechargeParkId: 'park-001', method: 'online',
          requestId: 'BROWSER-TAMPER-SUCCEEDED', items: [{ userId: 'U001', amount: 20 }]
        });
        assert(parkState.actions.confirmEnterpriseOnlinePayment(created.data.id, 'BROWSER-PAY-SUCCEEDED').ok, '入账准备失败');
        const item = parkState.state.rechargeBatchItems.find(function (candidate) { return candidate.batchId === created.data.id; });
        item.enterpriseId = 'E002';
        const replay = parkState.actions.postRechargeBatch(created.data.id);
        assert(!replay.ok && replay.code === 'BATCH_VALIDATION_FAILED', '成功批次篡改后不得幂等成功');
      });

      test('成功企业批次从支付确认入口重试时也校验篡改', function () {
        [
          { method: 'online', evidence: 'BROWSER-PAY-CONFIRM-TAMPER', confirm: 'confirmEnterpriseOnlinePayment' },
          { method: 'offline', evidence: 'browser-confirm-tamper.pdf', confirm: 'confirmOfflineRecharge' }
        ].forEach(function (scenario) {
          resetToDefaults();
          const created = parkState.actions.createEnterpriseRecharge({
            enterpriseId: 'E001', rechargeParkId: 'park-001', method: scenario.method,
            requestId: 'BROWSER-CONFIRM-TAMPER-' + scenario.method, items: [{ userId: 'U001', amount: 26 }]
          });
          assert(parkState.actions[scenario.confirm](created.data.id, scenario.evidence).ok, scenario.method + ' 入账准备失败');
          const legalReplay = parkState.actions[scenario.confirm](created.data.id, scenario.evidence);
          assert(legalReplay.ok && legalReplay.idempotent, scenario.method + ' 合法重试应幂等');
          const item = parkState.state.rechargeBatchItems.find(function (candidate) { return candidate.batchId === created.data.id; });
          item.enterpriseId = 'E002';
          const replay = parkState.actions[scenario.confirm](created.data.id, scenario.evidence);
          assert(!replay.ok && replay.code === 'BATCH_VALIDATION_FAILED', scenario.method + ' 确认入口应拒绝篡改');
        });
      });

      test('畸形企业充值行仍记录失败批次和原始输入', function () {
        resetToDefaults();
        const before = JSON.stringify(parkState.state.accounts);
        const response = parkState.actions.createEnterpriseRecharge({
          enterpriseId: 'E001', rechargeParkId: 'park-001', method: 'online', requestId: 'BROWSER-MALFORMED',
          items: [null]
        });
        assert(!response.ok && response.code === 'BATCH_VALIDATION_FAILED', '畸形行应返回 BATCH_VALIDATION_FAILED');
        const batch = parkState.state.rechargeBatches.find(function (item) { return item.requestId === 'BROWSER-MALFORMED'; });
        assert(batch && batch.status === 'validation_failed', '畸形行批次应持久化');
        const items = parkState.state.rechargeBatchItems.filter(function (item) { return item.batchId === batch.id; });
        assertEqual(items.length, 1, '畸形行应持久化');
        assert(items[0].userId === null && items[0].rawItem === null, '应保存 null 原始行且不伪造 userId');
        assert(Array.isArray(items[0].validationResult) && items[0].validationResult[0] === 'invalid_item', '应保存逐行错误结果');
        assertEqual(JSON.stringify(parkState.state.accounts), before, '畸形行不得改变余额');
        parkState.reloadForTests();
        assert(parkState.state.rechargeBatches.some(function (item) { return item.requestId === 'BROWSER-MALFORMED'; }), '重载后应保留畸形行批次');
      });

      test('状态校验拒绝提前支付依据和缺失收据', function () {
        resetToDefaults();
        const pending = parkState.actions.createEnterpriseRecharge({
          enterpriseId: 'E001', rechargeParkId: 'park-001', method: 'online',
          requestId: 'BROWSER-STATE-PENDING', items: [{ userId: 'U001', amount: 21 }]
        });
        const earlyEvidence = JSON.parse(JSON.stringify(parkState.state));
        earlyEvidence.rechargeBatches.find(function (item) { return item.id === pending.data.id; }).paymentReference = 'PAY-EARLY';
        assert(!parkState.internals.isValidState(earlyEvidence), 'pending 批次提前支付依据应拒绝');

        const personal = parkState.actions.rechargePersonal({ userId: 'U001', parkId: 'park-001', amount: 12, requestId: 'BROWSER-MISSING-RECEIPT' });
        const missingReceipt = JSON.parse(JSON.stringify(parkState.state));
        missingReceipt.invoiceRecords = missingReceipt.invoiceRecords.filter(function (item) { return item.sourceId !== personal.data.id; });
        assert(!parkState.internals.isValidState(missingReceipt), '成功个人充值缺失收据应拒绝');
      });

      test('跨园区消费使用企业余额优先、个人余额补足', function () {
        resetToDefaults();
        const current = account();
        const enterprise = enterpriseBalance();
        enterprise.available = 60;
        current.personal.available = 50;
        const response = parkState.actions.collectPayment({ userId: 'U001', merchantId: parkTwoMerchant().id, amount: 80, requestId: 'BROWSER-CROSS-1' });
        assert(response.ok, '跨园区消费失败：' + response.code);
        assertApprox(enterprise.available, 0, '企业余额');
        assertApprox(current.personal.available, 30, '个人余额');
        assertEqual(response.data.order.consumeParkId, 'park-002', '消费园区');
        assertApprox(response.data.order.enterpriseDeductions[0].amount, 60, '企业扣款');
        assertApprox(response.data.order.personalAmount, 20, '个人扣款');
      });

      test('跨园区消费重复请求返回原订单且不重复扣款', function () {
        resetToDefaults();
        const current = account();
        const enterprise = enterpriseBalance();
        const merchant = parkTwoMerchant();
        enterprise.available = 60;
        current.personal.available = 50;
        const input = { userId: 'U001', merchantId: merchant.id, amount: 80, requestId: 'BROWSER-CROSS-IDEMPOTENT' };
        const first = parkState.actions.collectPayment(input);
        assert(first.ok, '首次消费失败：' + first.code);
        const afterFirst = JSON.stringify(parkState.state);
        const replay = parkState.actions.collectPayment(input);
        assert(replay.ok && replay.idempotent, '重复消费应幂等返回');
        assertEqual(replay.data.order.id, first.data.order.id, '重复消费应返回原订单');
        assertEqual(JSON.stringify(parkState.state), afterFirst, '重复消费不得改变状态');
        assertApprox(enterprise.available, 0, '重复消费后企业余额');
        assertApprox(current.personal.available, 30, '重复消费后个人余额');
      });

      test('余额不足时不改变任何状态', function () {
        resetToDefaults();
        enterpriseBalance().available = 10;
        account().personal.available = 5;
        const before = JSON.stringify(parkState.state);
        const response = parkState.actions.collectPayment({ userId: 'U001', merchantId: parkTwoMerchant().id, amount: 80, requestId: 'BROWSER-CROSS-FAIL' });
        assert(!response.ok && response.code === 'INSUFFICIENT_BALANCE', '余额不足应失败');
        assertEqual(JSON.stringify(parkState.state), before, '失败消费不得改变状态');
      });

      test('原商户消费退款按原构成恢复且重复请求幂等', function () {
        resetToDefaults();
        const current = account();
        const enterprise = enterpriseBalance();
        const merchant = parkTwoMerchant();
        enterprise.available = 60;
        current.personal.available = 50;
        const paid = parkState.actions.collectPayment({ userId: 'U001', merchantId: merchant.id, amount: 80, requestId: 'BROWSER-REFUND-PAY' });
        assert(paid.ok, '消费准备失败');
        const first = parkState.actions.refundConsume(paid.data.order.id, { merchantId: merchant.id });
        const replay = parkState.actions.refundConsume(paid.data.order.id, { merchantId: merchant.id });
        assert(first.ok && replay.ok && replay.idempotent, '退款及幂等失败');
        assertApprox(enterprise.available, 60, '企业余额恢复');
        assertApprox(current.personal.available, 50, '个人余额恢复');
      });

      test('已结算消费订单退款转入冲正流程且状态不变', function () {
        resetToDefaults();
        const current = account();
        const enterprise = enterpriseBalance();
        const merchant = parkTwoMerchant();
        enterprise.available = 60;
        current.personal.available = 50;
        const paid = parkState.actions.collectPayment({ userId: 'U001', merchantId: merchant.id, amount: 80, requestId: 'BROWSER-SETTLED-REFUND-PAY' });
        assert(paid.ok, '消费准备失败');
        paid.data.order.settlementStatus = 'settled';
        const before = JSON.stringify(parkState.state);
        const response = parkState.actions.refundConsume(paid.data.order.id, { merchantId: merchant.id });
        assert(!response.ok && response.code === 'SETTLED_REFUND_REQUIRES_REVERSAL', '已结算订单应转入冲正流程');
        assertEqual(JSON.stringify(parkState.state), before, '已结算退款不得直接改变状态');
        assertApprox(enterprise.available, 0, '已结算退款不得恢复企业余额');
        assertApprox(current.personal.available, 30, '已结算退款不得恢复个人余额');
      });

      test('进入待结算记录的消费订单退款转入冲正流程且状态不变', function () {
        resetToDefaults();
        const current = account();
        const enterprise = enterpriseBalance();
        const merchant = parkTwoMerchant();
        enterprise.available = 60;
        current.personal.available = 50;
        const paid = parkState.actions.collectPayment({ userId: 'U001', merchantId: merchant.id, amount: 80, requestId: 'BROWSER-SETTLING-REFUND-PAY' });
        assert(paid.ok, '消费准备失败');
        const synced = parkState.actions.syncSettlements();
        assert(synced.ok && paid.data.order.settlementStatus === 'settling', '订单应已进入待结算记录');
        const before = JSON.stringify(parkState.state);
        const response = parkState.actions.refundConsume(paid.data.order.id, { merchantId: merchant.id });
        assert(!response.ok && response.code === 'SETTLED_REFUND_REQUIRES_REVERSAL', '已进入结算的订单应转入冲正流程');
        assertEqual(JSON.stringify(parkState.state), before, '待结算订单退款不得直接改变状态');
        assertApprox(enterprise.available, 0, '待结算订单退款不得恢复企业余额');
        assertApprox(current.personal.available, 30, '待结算订单退款不得恢复个人余额');
      });

      test('结算按消费园区和商户归组并更新订单状态', function () {
        resetToDefaults();
        const merchant = parkTwoMerchant();
        const paid = parkState.actions.collectPayment({ userId: 'U001', merchantId: merchant.id, amount: 12, requestId: 'BROWSER-SETTLEMENT-PAY' });
        assert(paid.ok, '消费准备失败');
        const synced = parkState.actions.syncSettlements();
        assert(synced.ok, '结算同步失败：' + synced.code);
        const settlement = parkState.state.pendingSettlements.find(function (item) {
          return Array.isArray(item.orderIds) && item.orderIds.indexOf(paid.data.order.id) >= 0;
        });
        assert(settlement, '消费订单未进入结算');
        assertEqual(settlement.consumeParkId, 'park-002', '结算归属消费园区');
        assertEqual(settlement.merchantId, merchant.id, '结算归属原商户');
        assertEqual(paid.data.order.settlementStatus, 'settling', '进入待结算记录后订单状态');
      });

      test('重复同步结算不重复纳入订单', function () {
        resetToDefaults();
        const merchant = parkTwoMerchant();
        const paid = parkState.actions.collectPayment({ userId: 'U001', merchantId: merchant.id, amount: 12, requestId: 'BROWSER-SETTLEMENT-IDEMPOTENT' });
        assert(paid.ok, '消费准备失败');
        const first = parkState.actions.syncSettlements();
        assert(first.ok && first.data.length === 1, '首次结算同步应创建一条记录');
        const afterFirst = JSON.stringify(parkState.state);
        const replay = parkState.actions.syncSettlements();
        assert(replay.ok && replay.data.length === 0, '重复同步不得创建结算记录');
        assertEqual(JSON.stringify(parkState.state), afterFirst, '重复同步不得改变状态');
        const occurrences = parkState.state.pendingSettlements.reduce(function (count, settlement) {
          return count + (settlement.orderIds.indexOf(paid.data.order.id) >= 0 ? 1 : 0);
        }, 0);
        assertEqual(occurrences, 1, '同一订单只能进入一条结算记录');
      });

      test('充值生成收据，消费订单可申请发票', function () {
        resetToDefaults();
        const recharge = parkState.actions.rechargePersonal({ userId: 'U001', parkId: 'park-001', amount: 20, requestId: 'BROWSER-RECEIPT' });
        assert(recharge.ok, '个人充值失败');
        assert(parkState.state.invoiceRecords.some(function (item) { return item.type === 'recharge_receipt'; }), '充值未生成收据');
        const paid = parkState.actions.collectPayment({ userId: 'U001', merchantId: parkTwoMerchant().id, amount: 10, requestId: 'BROWSER-INVOICE-PAY' });
        assert(paid.ok, '消费准备失败');
        const invoice = parkState.actions.applyConsumeInvoice({ orderId: paid.data.order.id, applicantUserId: 'U001', title: { name: '测试企业', taxId: '911100000000000001' }, requestId: 'BROWSER-INVOICE' });
        assert(invoice.ok && invoice.data.type === 'consume_invoice', '消费发票申请失败');
      });

      function renderResult(name, status, message, index) {
        const item = document.createElement('article');
        item.className = 'test-item';
        const header = document.createElement('header');
        const title = document.createElement('span');
        title.className = 'test-title';
        title.textContent = (index + 1) + '. ' + name;
        const badge = document.createElement('span');
        badge.className = 'test-badge ' + status;
        badge.textContent = status === 'pass' ? '通过' : '失败';
        const detail = document.createElement('div');
        detail.className = 'test-message' + (message ? ' show' : '');
        detail.textContent = message || '';
        header.appendChild(title);
        header.appendChild(badge);
        item.appendChild(header);
        item.appendChild(detail);
        document.getElementById('testList').appendChild(item);
      }

      function runTests() {
        const storage = snapshotStorage();
        passCount = 0;
        failCount = 0;
        document.getElementById('testList').innerHTML = '';
        tests.forEach(function (current, index) {
          try {
            current.fn();
            passCount++;
            renderResult(current.name, 'pass', '', index);
          } catch (error) {
            failCount++;
            renderResult(current.name, 'fail', error.message, index);
          }
        });
        restoreStorage(storage);
        if (typeof parkState.reloadForTests === 'function') parkState.reloadForTests();
        document.getElementById('passCount').textContent = passCount;
        document.getElementById('failCount').textContent = failCount;
      }

      document.getElementById('resetButton').addEventListener('click', function () {
        localStorage.removeItem('parkStateV2');
        localStorage.removeItem('parkStateV2Version');
        runTests();
      });

      runTests();
    })();
  </script>
