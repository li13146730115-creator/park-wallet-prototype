<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>原型测试运行器</title>
  <link rel="stylesheet" href="shared-styles.css">
  <style>
    .test-page {
      min-height: 100vh;
      padding: 0 var(--page-padding) 80px;
      background: var(--page-bg);
    }

    .test-header {
      background: var(--gradient-hero);
      margin: 0 calc(-1 * var(--page-padding)) 14px;
      padding: 24px 20px;
      color: #fff;
      text-align: center;
    }

    .test-header h1 {
      margin: 0 0 4px;
      font-size: 20px;
      font-weight: 700;
    }

    .test-header p {
      margin: 0;
      font-size: 12px;
      opacity: 0.88;
    }

    .summary {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-bottom: 16px;
    }

    .summary-item {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 12px 24px;
      box-shadow: var(--shadow-card);
      text-align: center;
    }

    .summary-item b {
      display: block;
      font-size: 22px;
      color: var(--ink);
    }

    .summary-item span {
      font-size: 12px;
      color: var(--muted);
    }

    .test-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .test-item {
      background: var(--card-bg);
      border-radius: var(--radius-small);
      padding: 14px 16px;
      box-shadow: var(--shadow-card);
    }

    .test-item header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .test-title {
      font-size: 14px;
      font-weight: 650;
      color: var(--ink);
    }

    .test-badge {
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 10px;
      white-space: nowrap;
    }

    .test-badge.pass {
      background: var(--success-bg);
      color: var(--success);
    }

    .test-badge.fail {
      background: var(--error-bg);
      color: var(--error);
    }

    .test-message {
      margin-top: 8px;
      font-size: 12px;
      color: var(--error);
      line-height: 1.5;
      padding: 8px 10px;
      background: var(--error-bg);
      border-radius: 8px;
      display: none;
    }

    .test-message.show { display: block; }

    .actions {
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }

    .reset-btn {
      width: 100%;
      max-width: 320px;
      height: 46px;
      border: 0;
      border-radius: var(--radius-button);
      background: var(--error);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 9px 20px rgba(255, 77, 79, 0.22);
    }

    .reset-btn:active { transform: scale(0.98); }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 18px;
      background: var(--card-bg);
      border-radius: var(--radius-pill);
      color: var(--info);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      box-shadow: var(--shadow-card);
    }

    @media (min-width: 768px) {
      .test-page {
        max-width: 680px;
        margin: 0 auto;
      }

      .test-header {
        border-radius: 0 0 var(--radius-card) var(--radius-card);
      }
    }
  </style>
</head>
<body>
  <div class="test-page">
    <div class="test-header">
      <h1>原型测试运行器</h1>
      <p>模拟状态操作断言 · 验证核心业务流程</p>
    </div>

    <div class="summary">
      <div class="summary-item">
        <b id="passCount">0</b>
        <span>通过</span>
      </div>
      <div class="summary-item">
        <b id="failCount">0</b>
        <span>失败</span>
      </div>
    </div>

    <div class="test-list" id="testList"></div>

    <div class="actions">
      <button class="reset-btn" type="button" onclick="resetState()">重置状态</button>
      <a class="back-link" href="index.html">返回原型首页</a>
    </div>
  </div>

  <script src="shared-state.js"></script>
  <script>
    (function () {
      'use strict';

      const tests = [];
      const asyncTests = [];
      let passCount = 0;
      let failCount = 0;

      function resetState() {
        parkState.reset();
        window.location.reload();
      }
      window.resetState = resetState;

      function resetToDefaults() {
        parkState.resetForTests();
      }

      function test(name, fn) {
        tests.push({ name, fn });
      }

      function asyncTest(name, fn) {
        asyncTests.push({ name, fn });
      }

      const ASYNC_TEST_TIMEOUT = 5000;

      function snapshotStorage() {
        return {
          parkStateV2: localStorage.getItem('parkStateV2'),
          parkV2AdminPark: localStorage.getItem('parkV2AdminPark')
        };
      }

      function restoreStorage(snapshot) {
        Object.keys(snapshot).forEach(function (key) {
          if (snapshot[key] === null) localStorage.removeItem(key);
          else localStorage.setItem(key, snapshot[key]);
        });
      }

      function assert(condition, message) {
        if (!condition) throw new Error(message || '断言失败');
      }

      function assertEqual(actual, expected, message) {
        if (actual !== expected) {
          throw new Error((message || '断言失败') + '：期望 ' + expected + '，实际 ' + actual);
        }
      }

      function assertApprox(actual, expected, message, epsilon = 0.001) {
        if (Math.abs(actual - expected) > epsilon) {
          throw new Error((message || '断言失败') + '：期望 ' + expected + '，实际 ' + actual);
        }
      }

      function persistedState() {
        return JSON.parse(localStorage.getItem('parkStateV2'));
      }

      function fetchSource(file) {
        return fetch(file, { cache: 'no-store' }).then(function (response) {
          if (!response.ok) throw new Error('缺少必需文件：' + file + '（HTTP ' + response.status + '）');
          return response.text();
        });
      }

      function assertContains(source, expected, message) {
        assert(source.indexOf(expected) > -1, message + '：缺少 ' + JSON.stringify(expected));
      }

      function assertNotContains(source, forbidden, message) {
        assert(source.indexOf(forbidden) === -1, message + '：仍包含 ' + JSON.stringify(forbidden));
      }

      function assertNoLegacyFields(value, path) {
        const forbidden = [
          ['prin', 'cipal'].join(''),
          ['gi', 'ft'].join(''),
          ['bo', 'nus'].join(''),
          ['cam', 'paign'].join(''),
          ['remaining', 'Gi', 'ft'].join(''),
          ['remaining', 'Prin', 'cipal'].join('')
        ];
        if (!value || typeof value !== 'object') return;
        Object.keys(value).forEach(key => {
          assert(!forbidden.includes(key), '发现旧字段：' + path + '.' + key);
          assertNoLegacyFields(value[key], path + '.' + key);
        });
      }

      test('默认状态来自生产重置且拒绝非法充值', function () {
        resetToDefaults();
        assert(!parkState.actions.recharge(0, 'REQ-ZERO').ok, '零金额应失败');
        assert(!parkState.actions.recharge(10, '').ok, '空 requestId 应失败');
        assertEqual(JSON.stringify(parkState.state.wallet), JSON.stringify({ total: 238, available: 238, frozen: 0 }), 'wallet');
        assertApprox(parkState.state.batches.reduce((sum, item) => sum + item.remaining, 0), 238, '默认批次余额');
      });

      test('默认用户使用完整手机号和所属企业', function () {
        resetToDefaults();
        assertEqual(parkState.state.user.phone, '13800131234', '默认用户手机号');
        assertEqual(parkState.state.user.enterpriseName, '北京海开智慧园区科技有限公司', '默认用户所属企业');
      });

      test('旧存储用户缺少 enterpriseName 时仍可迁移加载', function () {
        resetToDefaults();
        const legacy = JSON.parse(JSON.stringify(parkState.state));
        delete legacy.user.enterpriseName;
        const storedName = legacy.user.name;
        const storedPhone = legacy.user.phone;
        localStorage.setItem('parkStateV2', JSON.stringify(legacy));
        parkState.reloadForTests();
        assertEqual(parkState.state.user.name, storedName, '旧用户姓名不应被默认状态替换');
        assertEqual(parkState.state.user.phone, storedPhone, '旧用户手机号应保持原值');
        assertEqual(parkState.state.user.enterpriseName, undefined, '旧用户不应补造所属企业');
      });

      test('充值成功、持久化且重复调用幂等', function () {
        resetToDefaults();
        const first = parkState.actions.recharge(200, 'REQ-RECHARGE-1');
        const replay = parkState.actions.recharge(200, 'REQ-RECHARGE-1');
        const sameAmount = parkState.actions.recharge(200, 'REQ-RECHARGE-2');
        assert(first.ok && replay.ok && replay.idempotent && sameAmount.ok && !sameAmount.idempotent, '充值结果');
        assertApprox(parkState.state.wallet.total, 638, 'wallet.total');
        assertApprox(persistedState().wallet.total, 638, '持久化余额');
        assertEqual(parkState.state.transactions.filter(item => item.requestId === 'REQ-RECHARGE-1').length, 1, '请求流水数量');
        assertEqual(new Set(parkState.state.transactions.map(item => item.id)).size, parkState.state.transactions.length, '流水 ID 唯一');
        assertEqual(new Set(parkState.state.batches.map(item => item.id)).size, parkState.state.batches.length, '批次 ID 唯一');

        const stateReference = parkState.state;
        const stateBeforeFailure = JSON.stringify(parkState.state);
        const persistedBeforeFailure = localStorage.getItem('parkStateV2');
        const storagePrototype = Object.getPrototypeOf(localStorage);
        const originalSetItem = storagePrototype.setItem;
        let failed;
        storagePrototype.setItem = function () { throw new Error('模拟持久化失败'); };
        try {
          failed = parkState.actions.recharge(10, 'REQ-PERSIST-FAIL');
        } finally {
          storagePrototype.setItem = originalSetItem;
        }
        assert(!failed.ok && failed.code === 'PERSIST_FAILED', '持久化失败应返回统一失败');
        assert(parkState.state === stateReference, '回滚必须保持 state 引用');
        assertEqual(JSON.stringify(parkState.state), stateBeforeFailure, '持久化失败应回滚内存');
        assertEqual(localStorage.getItem('parkStateV2'), persistedBeforeFailure, '持久化失败不得覆盖存储');
      });

      test('新测试订单消费成功、持久化且重复调用幂等', function () {
        resetToDefaults();
        const first = parkState.actions.consume('YQBLD-2026071509100001');
        const second = parkState.actions.consume('YQBLD-2026071509100001');
        assert(first.ok && second.ok && second.idempotent, '消费结果');
        assertApprox(parkState.state.wallet.total, 226, 'wallet.total');
        assertEqual(persistedState().orders.find(item => item.id === 'YQBLD-2026071509100001').status, 'paid', '持久化订单状态');
        assertEqual(parkState.state.transactions.filter(item => item.orderId === 'YQBLD-2026071509100001' && item.type === 'consume').length, 1, '消费流水数量');
        assertEqual(parkState.state.orders.find(item => item.id === 'YQBLD-2026071509100001').batchAllocations.length, 1, '消费批次分配');
        assertApprox(parkState.state.batches[0].remaining, 88, '先进先出扣减');
        assertApprox(parkState.state.batches.reduce((sum, item) => sum + item.remaining, 0), 226, '批次与钱包一致');
        resetToDefaults();
        parkState.state.orders.find(item => item.id === 'YQBLD-2026071509100001').amount = 9999;
        const snapshot = JSON.stringify(parkState.state);
        assert(!parkState.actions.consume('YQBLD-2026071509100001').ok, '余额不足应失败');
        assertEqual(JSON.stringify(parkState.state), snapshot, '余额不足不得部分扣减');
      });

      test('消费退款恢复余额且重复调用幂等', function () {
        resetToDefaults();
        parkState.actions.consume('YQBLD-2026071509100001');
        const first = parkState.actions.refundConsume('YQBLD-2026071509100001');
        const second = parkState.actions.refundConsume('YQBLD-2026071509100001');
        assert(first.ok && second.ok && second.idempotent, '消费退款结果');
        assertApprox(parkState.state.wallet.total, 238, 'wallet.total');
        assertEqual(parkState.state.transactions.filter(item => item.orderId === 'YQBLD-2026071509100001' && item.type === 'consume_refund').length, 1, '退款流水数量');
        assertApprox(parkState.state.batches[0].remaining, 100, '退款恢复原批次');
        assertEqual(new Set(parkState.state.transactions.map(item => item.id)).size, parkState.state.transactions.length, '退款流水 ID 唯一');
      });

      test('唯一余额退款申请冻结全部可用余额', function () {
        resetToDefaults();
        const first = parkState.actions.applyBalanceRefund('测试退款-唯一');
        const second = parkState.actions.applyBalanceRefund('测试退款-唯一');
        assert(first.ok && second.ok && second.idempotent, '申请结果');
        assertApprox(parkState.state.wallet.available, 0, 'wallet.available');
        assertApprox(parkState.state.wallet.frozen, 238, 'wallet.frozen');
        assertEqual(parkState.state.refundRequests.length, 1, '退款申请数量');
        assertApprox(persistedState().wallet.frozen, 238, '持久化冻结金额');
        assertApprox(first.data.batchAllocations.reduce((sum, item) => sum + item.amount, 0), 238, '冻结批次快照');
        assert(parkState.actions.rejectParkRefund(first.data.id).ok, '初审驳回');
        assertApprox(parkState.state.wallet.available, 238, '驳回恢复可用余额');
        assertApprox(parkState.state.batches.reduce((sum, item) => sum + item.remaining, 0), 238, '驳回不改变批次');
      });

      test('余额退款审批只退申请快照并保留后续充值', function () {
        resetToDefaults();
        const applied = parkState.actions.applyBalanceRefund('测试退款-审批');
        const id = applied.data.id;
        assert(parkState.actions.approveParkRefund(id).ok, '园区审批');
        assert(parkState.actions.approveParkRefund(id).idempotent, '重复审批应幂等');
        assert(parkState.actions.recharge(50, 'REQ-AFTER-REFUND').ok, '审批期间充值');
        const first = parkState.actions.completeBalanceRefund(id);
        const second = parkState.actions.completeBalanceRefund(id);
        assert(first.ok && second.ok && second.idempotent, '物业复审结果');
        assertApprox(parkState.state.wallet.total, 50, 'wallet.total');
        assertApprox(parkState.state.wallet.available, 50, 'wallet.available');
        assertApprox(parkState.state.wallet.frozen, 0, 'wallet.frozen');
        assertEqual(parkState.state.transactions.filter(item => item.refundId === id && item.type === 'balance_refund').length, 1, '余额退款流水数量');
        assertApprox(parkState.state.batches.reduce((sum, item) => sum + item.remaining, 0), 50, '仅保留新充值批次');
        assertApprox(persistedState().wallet.total, 50, '持久化保留新充值');
      });

      test('损坏状态拒绝存储并在初始化时回退默认', function () {
        resetToDefaults();
        const before = JSON.stringify(parkState.state);
        const result = parkState.actions.consume('NOT-FOUND');
        assert(!result.ok, '不存在订单应失败');
        assertEqual(JSON.stringify(parkState.state), before, '失败动作不得改状态');
        parkState.state.wallet.total = -1;
        assert(!parkState.save(), '负数钱包不得写入存储');
        assertEqual(persistedState().wallet.total, 238, '拒绝覆盖合法存储');
        resetToDefaults();
        parkState.state.unexpected = true;
        assert(!parkState.save(), '未知顶层键不得写入存储');
        resetToDefaults();
        parkState.state.user.role = 'admin';
        assert(!parkState.save(), 'user 未定义字段不得写入存储');
        resetToDefaults();
        parkState.state.transactions[0].title = '<img src=x>';
        assert(!parkState.save(), '含尖括号的可渲染字符串不得写入存储');
        resetToDefaults();
        const damaged = JSON.parse(before);
        damaged.wallet.total = 999;
        localStorage.setItem('parkStateV2', JSON.stringify(damaged));
        parkState.reloadForTests();
        assertApprox(parkState.state.wallet.total, 238, '损坏状态回退默认');
        assertNoLegacyFields(parkState.state, 'state');
        const serialized = JSON.stringify(parkState.state);
        const forbiddenTerms = [
          ['prin', 'cipal'].join(''),
          ['gi', 'ft'].join(''),
          ['bo', 'nus'].join(''),
          ['cam', 'paign'].join(''),
          ['remaining', 'Gi', 'ft'].join(''),
          ['remaining', 'Prin', 'cipal'].join(''),
          ['gi', 'ft', '_cl', 'ear'].join('')
        ];
        forbiddenTerms.forEach(term => assert(!serialized.includes(term), '状态中包含历史字段或类型：' + term));
      });

      test('严格拒绝核对与结算状态字段不匹配', function () {
        function assertSaveRejected(mutator, message) {
          resetToDefaults();
          const persistedBefore = localStorage.getItem('parkStateV2');
          mutator();
          assert(!parkState.save(), message);
          assertEqual(localStorage.getItem('parkStateV2'), persistedBefore, message + '不得覆盖合法存储');
        }

        assertSaveRejected(function () {
          const row = parkState.state.reconciliationRows[0];
          row.checked = true;
          row.checkedAt = null;
        }, 'checked=true 时 checkedAt=null 应拒绝');

        assertSaveRejected(function () {
          const settlement = parkState.state.pendingSettlements[0];
          settlement.status = 'success';
        }, 'success 无付款凭证和时间应拒绝');

        assertSaveRejected(function () {
          const settlement = parkState.state.pendingSettlements[0];
          settlement.status = 'failed';
          settlement.paymentRecordedAt = '2026-07-16 12:00';
        }, 'failed 无失败原因应拒绝');

        ['pending', 'processing'].forEach(function (status) {
          assertSaveRejected(function () {
            const settlement = parkState.state.pendingSettlements[0];
            settlement.status = status;
            settlement.paymentReference = 'PAY-INVALID';
            settlement.paymentRecordedAt = '2026-07-16 12:00';
          }, status + ' 携带结果字段应拒绝');
        });
      });

      test('扫码创建待确认订单并持久化', function () {
        resetToDefaults();
        const beforeOrderCount = parkState.state.orders.length;
        const result = parkState.actions.createPendingOrder('测试商户', 'M999', 36.50);
        assert(result.ok, '创建订单应成功：' + (result.code || 'unknown'));
        const order = result.data;
        assert(order, '返回订单对象');
        assert(order.status === 'pending_confirm', 'status');
        assert(order.merchant === '测试商户', 'merchant');
        assert(order.merchantId === 'M999', 'merchantId');
        assertApprox(order.amount, 36.50, 'amount');
        assert(order.id && order.id.startsWith('O'), 'id');
        assert(order.time, 'time');
        assert(order.refundDeadline, 'refundDeadline');
        assertEqual(Object.keys(order).filter(k => k === ['prin', 'cipal'].join('') || k === ['gi', 'ft'].join('')).length, 0, '订单不含旧余额字段');
        assertEqual(parkState.state.orders.length, beforeOrderCount + 1, 'orders 增加');
        assert(persistedState().orders.find(item => item.id === order.id), '持久化');
      });

      test('createPendingOrder 拒绝非法金额并允许重复创建', function () {
        resetToDefaults();
        const invalid = parkState.actions.createPendingOrder('测试商户', 'M999', 0);
        assert(!invalid.ok, '0 金额应失败');
        const first = parkState.actions.createPendingOrder('测试商户', 'M999', 10);
        const second = parkState.actions.createPendingOrder('测试商户', 'M999', 10);
        assert(first.ok && second.ok && !second.idempotent, '相同金额允许重复创建且非幂等');
        assert(first.data.id !== second.data.id, '重复创建应生成不同 id');
        assert(new Set(parkState.state.orders.map(item => item.id)).size === parkState.state.orders.length, 'id 唯一');
      });

      test('确认消费流程：创建 -> 扣款成功 -> 持久化', function () {
        resetToDefaults();
        const order = parkState.actions.createPendingOrder('海智咖啡 HUB', 'M002', 18.00).data;
        const beforeTotal = parkState.state.wallet.total;
        const consumeResult = parkState.actions.consume(order.id);
        assert(consumeResult.ok, 'consume 应成功：' + (consumeResult.code || 'unknown'));
        assertApprox(parkState.state.wallet.total, beforeTotal - 18.00, '扣款后 total');
        assertEqual(parkState.state.orders.find(item => item.id === order.id).status, 'paid', 'paid');
        assertEqual(parkState.state.transactions.filter(item => item.orderId === order.id && item.type === 'consume').length, 1, '消费流水');
        assert(persistedState().orders.find(item => item.id === order.id).status === 'paid', '持久化 paid');
      });

      test('拒绝或超时关闭后 consume 失败', function () {
        resetToDefaults();
        const orderA = parkState.actions.createPendingOrder('商户A', 'M001', 10).data;
        orderA.status = 'closed';
        const orderB = parkState.actions.createPendingOrder('商户B', 'M002', 10).data;
        orderB.status = 'closed';
        assert(!parkState.actions.consume(orderA.id).ok, 'closed 订单应不可 consume');
        assert(!parkState.actions.consume(orderB.id).ok, 'closed 订单应不可 consume');
        assertEqual(parkState.state.orders.find(item => item.id === orderA.id).status, 'closed', '状态不变');
      });

      test('余额不足时创建订单成功但 consume 失败', function () {
        resetToDefaults();
        const order = parkState.actions.createPendingOrder('大额商户', 'M999', 999999).data;
        const result = parkState.actions.consume(order.id);
        assert(!result.ok && result.code === 'INSUFFICIENT_BALANCE', '余额不足');
        assertEqual(parkState.state.orders.find(item => item.id === order.id).status, 'pending_confirm', '仍为 pending_confirm');
        assertEqual(parkState.state.transactions.filter(item => item.orderId === order.id).length, 0, '无流水');
      });

      test('订单状态流转后扫描无旧余额拆分字段', function () {
        resetToDefaults();
        const order = parkState.actions.createPendingOrder('拆分扫描', 'M998', 20).data;
        parkState.actions.consume(order.id);
        assertNoLegacyFields(parkState.state, 'state');
        const serialized = JSON.stringify(parkState.state);
        const bad = [

      function runAsyncTests() {
        if (asyncTests.length === 0) return Promise.resolve();
        const list = document.getElementById('testList');
        let index = 0;

        function runNext() {
          if (index >= asyncTests.length) return Promise.resolve();
          const t = asyncTests[index++];
          const item = document.createElement('div');
          item.className = 'test-item';
          const header = document.createElement('header');
          const title = document.createElement('span');
          title.className = 'test-title';
          title.textContent = (tests.length + index) + '. ' + t.name;
          const badge = document.createElement('span');
          badge.className = 'test-badge';
          const message = document.createElement('div');
          message.className = 'test-message';

          list.appendChild(item);
          header.appendChild(title);
          header.appendChild(badge);
          item.appendChild(header);
          item.appendChild(message);

          return new Promise(function (resolve) {
            let resolved = false;
            const storageSnapshot = snapshotStorage();
            const testContext = createTestContext();
            const timeoutId = testContext.setTimer(function () { done(new Error('异步测试超时：' + t.name)); }, ASYNC_TEST_TIMEOUT);
            function done(err) {
              if (resolved) return;
              resolved = true;
              testContext.cancelAll();
              if (parkState && typeof parkState.resetForTests === 'function') parkState.resetForTests();
              restoreStorage(storageSnapshot);
              if (parkState && typeof parkState.reloadForTests === 'function') parkState.reloadForTests();
              if (err) {
                failCount++;
                badge.classList.add('fail');
                badge.textContent = '失败';
                message.classList.add('show');
                message.textContent = err.message;
              } else {
                passCount++;
                badge.classList.add('pass');
                badge.textContent = '通过';
              }
              document.getElementById('passCount').textContent = passCount;
              document.getElementById('failCount').textContent = failCount;
              resolve();
            }
            try {
              t.fn(done, testContext);
            } catch (err) {
              done(err);
            }
          }).then(runNext);
        }
        return runNext();
      }

      function createTestContext() {
        const timers = new Set();
        const iframes = new Set();
        const cleanups = new Set();
        let closed = false;
        function setTimer(fn, delay) {
          if (closed) return null;
          const id = setTimeout(function () {
            timers.delete(id);
            if (!closed) fn();
          }, delay);
          timers.add(id);
          return id;
        }
        function clearTimer(id) {
          if (id === null || id === undefined) return;
          clearTimeout(id);
          timers.delete(id);
        }
        function addCleanup(fn) { cleanups.add(fn); return fn; }
        function removeIframe(iframe) {
          if (!iframe) return;
          iframes.delete(iframe);
          iframe.onload = null;
          iframe.onerror = null;
          try {
            const frameState = iframe.contentWindow && iframe.contentWindow.parkState;
            if (frameState && typeof frameState.resetForTests === 'function') frameState.resetForTests();
          } catch (_) {}
          if (iframe.parentNode) iframe.parentNode.removeChild(iframe);
        }
        return {
          setTimer: setTimer,
          clearTimer: clearTimer,
          delay: function (delay) { return new Promise(function (resolve) { setTimer(resolve, delay); }); },
          addCleanup: addCleanup,
          trackIframe: function (iframe) { iframes.add(iframe); return iframe; },
          removeIframe: removeIframe,
          cancelAll: function () {
            closed = true;
            timers.forEach(clearTimeout);
            timers.clear();
            cleanups.forEach(function (cleanup) { try { cleanup(); } catch (_) {} });
            cleanups.clear();
            Array.from(iframes).forEach(removeIframe);
          }
        };
      }

      function iframeStage(name, onLoad) {
        return { name: name, onLoad: onLoad };
      }

      function withIframeStages(src, stages, done, ctx) {
        let settled = false;
        let stageIndex = 0;
        let waitingForLoad = true;
        let loadTimer = null;
        const iframe = document.createElement('iframe');

        function clearLoadTimer() {
          ctx.clearTimer(loadTimer);
          loadTimer = null;
        }

        function resetFrameState() {
          try {
            const frameState = iframe.contentWindow && iframe.contentWindow.parkState;
            if (frameState && typeof frameState.resetForTests === 'function') frameState.resetForTests();
          } catch (_) {}
        }

        function settle(err) {
          if (settled) return;
          settled = true;
          clearLoadTimer();
          iframe.onload = null;
          iframe.onerror = null;
          resetFrameState();
          ctx.removeIframe(iframe);
          done(err);
        }

        function armLoadTimeout() {
          clearLoadTimer();
          const stage = stages[stageIndex];
          loadTimer = ctx.setTimer(function () {
            settle(new Error('iframe 加载超时：' + src + '（阶段：' + (stage ? stage.name : 'unknown') + '）'));
          }, ASYNC_TEST_TIMEOUT);
        }

        function onLoad() {
          if (settled) return;
          if (!waitingForLoad) {
            settle(new Error('iframe 重复 load：' + src + '（阶段：' + stages[stageIndex].name + '）'));
            return;
          }
          clearLoadTimer();
          waitingForLoad = false;
          const stage = stages[stageIndex];
          if (!stage) {
            settle(new Error('iframe load 超出声明阶段：' + src));
            return;
          }
          const api = {
            delay: ctx.delay,
            done: function () { settle(); },
            fail: settle,
            nextLoad: function () {
              if (settled) return;
              if (waitingForLoad) throw new Error('iframe 阶段已等待下一次 load：' + stage.name);
              if (stageIndex + 1 >= stages.length) throw new Error('iframe 阶段未声明下一次 load：' + stage.name);
              stageIndex++;
              waitingForLoad = true;
              armLoadTimeout();
            },
            navigate: function (url) {
              api.nextLoad();
              iframe.src = url;
            }
          };
          try {
            const result = stage.onLoad(iframe, api, ctx);
            if (result && typeof result.then === 'function') result.catch(settle);
          } catch (err) {
            settle(err);
          }
        }

        iframe.style.cssText = 'position:fixed;top:-9999px;left:-9999px;width:1px;height:1px;';
        iframe.onload = onLoad;
        iframe.onerror = function () { settle(new Error('iframe 加载失败：' + src)); };
        ctx.trackIframe(iframe);
        armLoadTimeout();
        document.body.appendChild(iframe);
        iframe.src = src;
      }

            assert(row.textContent.indexOf(item[1]) > -1, '第 ' + (index + 1) + ' 行应显示' + item[1]);
            assert(row.textContent.indexOf(item[2]) > -1, '第 ' + (index + 1) + ' 行应显示' + item[2]);
            const button = row.querySelector('button');
            assertEqual(Boolean(button), item[3], item[2] + '申请按钮可见性');
            if (button) assertEqual(button.textContent.trim(), '申请开票', '未开票行操作文案');
          });
          api.done();
        })], done, ctx);
      });

      asyncTest('浏览器行为：充值记录行进入对应详情页', function (done, ctx) {
        resetToDefaults();
        let transactionId;
        withIframeStages('user-invoices.html', [
          iframeStage('invoice-list', async function (iframe, api) {
            await api.delay(100);
            const row = iframe.contentWindow.document.querySelector('.invoice-record');
            assert(row, '开票页应渲染可点击的充值记录');
            transactionId = row.dataset.transactionId;
            assert(transactionId, '充值记录行应通过 data-transaction-id 标识交易');
            api.nextLoad();
            row.click();
          }),
          iframeStage('recharge-detail', async function (iframe, api) {
            await api.delay(100);
            assert(iframe.contentWindow.location.href.indexOf('user-recharge-detail.html?id=' + encodeURIComponent(transactionId)) > -1, '充值记录应进入对应详情页');

          })
        ], done, ctx);
      });

      asyncTest('浏览器行为：申请开票阻止行跳转并打开弹窗', function (done, ctx) {
        resetToDefaults();
        withIframeStages('user-invoices.html', [iframeStage('initial', async function (iframe, api) {
          await api.delay(100);
          const win = iframe.contentWindow;
          const doc = win.document;
          const row = doc.querySelector('.invoice-record');
          assert(row, '开票页应渲染充值记录');
          const button = row.querySelector('button');
          assert(button, '充值记录应渲染申请开票按钮');
          const hrefBefore = win.location.href;
          let stopped = 0;
          const originalStopPropagation = win.Event.prototype.stopPropagation;
          ctx.addCleanup(function () { win.Event.prototype.stopPropagation = originalStopPropagation; });
          win.Event.prototype.stopPropagation = function () {
            stopped++;
            return originalStopPropagation.call(this);
          };
          button.click();
          win.Event.prototype.stopPropagation = originalStopPropagation;
          await api.delay(100);
          const failures = [];
          if (stopped !== 1) failures.push('stopPropagation 应调用 1 次，实际 ' + stopped + ' 次');
          if (!doc.getElementById('apply-modal').classList.contains('active')) failures.push('申请弹窗未打开');
          if (win.location.href !== hrefBefore) failures.push('错误触发充值记录跳转');
          assertEqual(failures.length, 0, failures.join('；'));
          api.done();
        })], done, ctx);
      });

      asyncTest('浏览器行为：更多菜单完整点击交互', function (done, ctx) {
        resetToDefaults();
        withIframeStages('user-recharge.html', [iframeStage('initial', async function (iframe, api) {
          await api.delay(100);
          const win = iframe.contentWindow;
          const doc = win.document;
          const button = doc.getElementById('more-button');
          const menu = doc.getElementById('more-menu');
          const refundLink = menu && menu.querySelector('a[href="user-refund.html"]');
          assert(button, '充值页应存在更多按钮');
          assert(menu, '充值页应存在更多菜单');
          assert(refundLink, '更多菜单应存在注销链接');
          assertEqual(refundLink.getAttribute('href'), 'user-refund.html', '注销链接目标');

          button.click();
          assertEqual(button.getAttribute('aria-expanded'), 'true', '点击后 aria-expanded');
          assert(!menu.hidden, '点击后更多菜单应显示');
          menu.click();
          assertEqual(button.getAttribute('aria-expanded'), 'true', '点击菜单容器应阻止冒泡并保持展开');
          assert(!menu.hidden, '点击菜单容器后菜单应保持显示');

          refundLink.addEventListener('click', function (event) { event.preventDefault(); });
          refundLink.click();
          assertEqual(button.getAttribute('aria-expanded'), 'false', '点击注销链接后 aria-expanded 应先复位');
          assert(menu.hidden, '点击注销链接后菜单应先关闭');
          assertEqual(refundLink.getAttribute('href'), 'user-refund.html', '注销链接点击后目标保持正确');

          button.click();
          doc.dispatchEvent(new win.MouseEvent('click', { bubbles: true }));
          assertEqual(button.getAttribute('aria-expanded'), 'false', '文档点击后 aria-expanded');
          assert(menu.hidden, '文档点击后更多菜单应隐藏');
          api.done();
        })], done, ctx);
      });

      asyncTest('浏览器渲染：后台页面显示唯一完整手机号', function (done, ctx) {

        resetToDefaults();

        withIframeStages(pages[0], stages, done, ctx);
      });

      asyncTest('DOM stub：merchant-scan 确认收款直接完成', function (done, ctx) {
        resetToDefaults();
        const orderCountBefore = parkState.state.orders.length;
        withIframeStages('merchant-scan.html', [
          iframeStage('scan', async function (iframe, api) {
            await api.delay(200);
            const doc = iframe.contentWindow.document;
            const scanBtn = doc.getElementById('scan-btn');
            if (scanBtn) scanBtn.click();
            ['2', '5', '5', '0'].forEach(function (key) {
              const btn = doc.querySelector('.key[data-key="' + key + '"]');
              if (btn) btn.click();
            });
            const remarkInput = doc.getElementById('remark-input');
            assert(remarkInput, '应存在备注输入框');
            remarkInput.value = '午餐套餐\n少放辣';
            doc.getElementById('confirm-amount-btn').click();
            await api.delay(200);
            parkState.reloadForTests();
            assert(parkState.state.orders.length > orderCountBefore, '订单应已创建');
            const order = parkState.state.orders[parkState.state.orders.length - 1];
            assert(order.status === 'paid', '收款应直接完成，status 为 paid');
            assert(order.merchantId === 'M002', 'merchantId 正确');
            assertApprox(order.amount, 25.50, 'amount 正确');
            assertEqual(order.remark, '午餐套餐\n少放辣', '多行备注应保留换行');
            assert(!order[['prin', 'cipal'].join('')] && !order[['gi', 'ft'].join('')], '订单不含旧余额字段');
            assert(doc.getElementById('result-screen').classList.contains('active'), '应显示收款结果页');
            assert(doc.getElementById('result-title').textContent === '收款成功', '结果页标题应为收款成功');
            api.done();
          })
        ], done, ctx);
      });

      function runTests() {
        const list = document.getElementById('testList');
        list.innerHTML = '';
        passCount = 0;
        failCount = 0;

        tests.forEach((t, index) => {
          const item = document.createElement('div');
          item.className = 'test-item';
          const header = document.createElement('header');
          const title = document.createElement('span');
          title.className = 'test-title';
          title.textContent = (index + 1) + '. ' + t.name;
          const badge = document.createElement('span');
          badge.className = 'test-badge';
          const message = document.createElement('div');
          message.className = 'test-message';

          try {
            t.fn();
            passCount++;
            badge.classList.add('pass');
            badge.textContent = '通过';
          } catch (err) {
            failCount++;
            badge.classList.add('fail');
            badge.textContent = '失败';
            message.classList.add('show');
            message.textContent = err.message;
          }

          header.appendChild(title);
          header.appendChild(badge);
          item.appendChild(header);
          item.appendChild(message);
          list.appendChild(item);
        });

        document.getElementById('passCount').textContent = passCount;
        document.getElementById('failCount').textContent = failCount;

        runAsyncTests().then(function () {
          document.getElementById('passCount').textContent = passCount;
          document.getElementById('failCount').textContent = failCount;
        });
      }

      runTests();
    })();
  </script>
