<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>充值批次 - 园区储值</title>
  <link rel="stylesheet" href="shared-styles.css">
  <style>
    .batch-layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 18px; }
    .panel { background: var(--card-bg); border-radius: 12px; padding: 16px; box-shadow: var(--shadow-card); }
    .panel h2 { margin: 0 0 14px; font-size: 16px; }
    .batch-row { cursor: pointer; }
    .batch-row:hover { background: #f8fbff; }
    .batch-row.selected { background: var(--info-bg); }
    .status { display: inline-flex; padding: 4px 8px; border-radius: 8px; font-size: 11px; font-weight: 700; }
    .status-success { color: #177444; background: var(--success-bg); }
    .status-pending { color: #9a6500; background: var(--warning-bg); }
    .status-error { color: #b42325; background: var(--error-bg); }
    .detail-list { display: grid; gap: 10px; }
    .detail-item { padding: 12px; border: 1px solid var(--border); border-radius: 9px; }
    .detail-head { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; }
    .detail-meta { margin-top: 6px; color: var(--muted); font-size: 12px; }
    .empty { padding: 30px 8px; color: var(--muted); text-align: center; font-size: 13px; }
    .muted { color: var(--muted); }
    @media (max-width: 980px) { .batch-layout { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="brand">海智园区 · 企业管理</div>
      <nav>
        <a href="enterprise-overview.html">资金概览</a>
        <a href="enterprise-employees.html">员工账户</a>
        <a href="enterprise-recharge.html">在线充值</a>
        <a class="active" href="enterprise-batches.html">充值批次</a>
        <a href="enterprise-refunds.html">企业余额退款</a>
        <a href="enterprise-receipts.html">企业收据</a>
      </nav>
    </aside>
    <main class="admin-content">
      <div class="admin-header">
        <div><h1>充值批次</h1><p>查看企业批量充值的支付与入账进度</p></div>
        <a href="enterprise-recharge.html">新建在线充值</a>
      </div>
      <div class="batch-layout">
        <section class="admin-table">
          <table>
            <thead><tr><th>批次编号</th><th>充值方式</th><th>总金额</th><th>支付状态</th><th>入账状态</th><th>创建时间</th></tr></thead>
            <tbody id="batchRows"></tbody>
          </table>
        </section>
        <aside class="panel">
          <h2>批次明细</h2>
          <div class="detail-list" id="batchDetails"></div>
        </aside>
      </div>
    </main>
  </div>
  <script src="shared-state.js"></script>
  <script>
    (function () {
      'use strict';
      const enterpriseId = 'E001';
      const parkState = window.parkState;
      const batches = parkState.selectors.getRechargeBatchesByEnterprise(enterpriseId).slice().sort(function (a, b) {
        return String(b.createdAt).localeCompare(String(a.createdAt));
      });
      const batchRows = document.getElementById('batchRows');
      const batchDetails = document.getElementById('batchDetails');
      let selectedId = null;

      function money(value) { return '¥' + Number(value || 0).toFixed(2); }
      function clearNode(node) { while (node.firstChild) node.removeChild(node.firstChild); }
      function statusText(value) {
        return { pending: '待处理', succeeded: '已成功', not_posted: '未入账', validation_failed: '校验失败' }[value] || value || '-';
      }
      function statusClass(value) {
        if (value === 'succeeded') return 'status status-success';
        if (value === 'validation_failed' || value === 'not_posted') return 'status status-error';
        return 'status status-pending';
      }
      function statusNode(value) {
        const span = document.createElement('span');
        span.className = statusClass(value);
        span.textContent = statusText(value);
        return span;
      }
      function cell(text, className) {
        const td = document.createElement('td');
        td.textContent = text;
        if (className) td.className = className;
        return td;
      }

      function renderDetails(batch) {
        clearNode(batchDetails);
        if (!batch) {
          const empty = document.createElement('div');
          empty.className = 'empty';
          empty.textContent = batches.length ? '选择一个批次查看员工明细' : '暂无充值批次，请先发起在线充值。';
          batchDetails.appendChild(empty);
          return;
        }
        const items = parkState.state.rechargeBatchItems.filter(function (item) { return item.batchId === batch.id; });
        if (!items.length) {
          const empty = document.createElement('div');
          empty.className = 'empty';
          empty.textContent = '该批次暂无明细。';
          batchDetails.appendChild(empty);
          return;
        }
        items.forEach(function (item) {
          const user = item.userId ? parkState.selectors.getUserById(item.userId) : null;
          const wrapper = document.createElement('div');
          wrapper.className = 'detail-item';
          const head = document.createElement('div');
          head.className = 'detail-head';
          const name = document.createElement('strong');
          name.textContent = user ? user.name : '未知员工';
          const amount = document.createElement('strong');
          amount.textContent = item.amount === null ? '-' : money(item.amount);
          head.appendChild(name);
          head.appendChild(amount);
          const meta = document.createElement('div');
          meta.className = 'detail-meta';
          meta.textContent = '入账状态：' + statusText(item.postingStatus) + ' · 校验：' + item.validationResult.join('、');
          wrapper.appendChild(head);
          wrapper.appendChild(meta);
          batchDetails.appendChild(wrapper);
        });
      }

      function selectBatch(batch) {
        selectedId = batch.id;
        Array.prototype.forEach.call(batchRows.querySelectorAll('tr'), function (row) {
          row.classList.toggle('selected', row.dataset.batchId === selectedId);
        });
        renderDetails(batch);
      }

      if (!batches.length) {
        const tr = document.createElement('tr');
        const td = cell('暂无充值批次，可前往在线充值创建。', 'muted');
        td.colSpan = 6;
        tr.appendChild(td);
        batchRows.appendChild(tr);
        renderDetails(null);
      } else {
        batches.forEach(function (batch) {
          const tr = document.createElement('tr');
          tr.className = 'batch-row';
          tr.dataset.batchId = batch.id;
          tr.tabIndex = 0;
          tr.appendChild(cell(batch.id));
          tr.appendChild(cell(batch.method === 'online' ? '在线支付' : '园区代充值'));
          tr.appendChild(cell(money(batch.totalAmount)));
          const payment = document.createElement('td');
          payment.appendChild(statusNode(batch.paymentStatus));
          tr.appendChild(payment);
          const posting = document.createElement('td');
          posting.appendChild(statusNode(batch.postingStatus));
          tr.appendChild(posting);
          tr.appendChild(cell(batch.createdAt || '-', 'muted'));
          tr.addEventListener('click', function () { selectBatch(batch); });
          tr.addEventListener('keydown', function (event) {
            if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); selectBatch(batch); }
          });
          batchRows.appendChild(tr);
        });
        selectBatch(batches[0]);
      }
    })();
  </script>
</body>
</html>
